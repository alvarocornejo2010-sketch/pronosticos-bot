# Mira cada 3 horas que la web de Cloudflare se sigue actualizando. Si no (el cron
# parado, el token caducado, la API caída), la tarea falla y GitHub manda un email
# a quien la creó o cambió por última vez el cron de este archivo. También falla si el
# cron se queda sin tiempo (2 pasadas muertas seguidas o 3 en el día) o si algún CSV de
# tiros a puerta lleva más de 24 horas sin bajar: la web seguiría actualizándose y no se
# notaría. Lo prueba pruebas/salud.py, que corre este mismo guion contra el Worker local.
# Ojo: en un repo público, GitHub desactiva las tareas programadas tras 60 días sin
# actividad en el repo (avisa antes por email; se reactivan en la pestaña Actions).
# Para probar el aviso: Actions → vigilancia → Run workflow, con una URL que no exista.
name: vigilancia

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Web que se mira (para probar el aviso, una que no exista)"
        default: "https://pronosticos-bot.alvarocornejo2010.workers.dev"

permissions: {}

jobs:
  salud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirar /salud
        env:
          URL: ${{ inputs.url || 'https://pronosticos-bot.alvarocornejo2010.workers.dev' }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          url = os.environ["URL"].rstrip("/") + "/salud"
          # con el User-Agent de urllib ("Python-urllib/3.x"), Cloudflare responde 403
          pedido = urllib.request.Request(url, headers={
              "User-Agent": "pronosticos-bot-vigilancia (GitHub Actions; +https://github.com/alvarocornejo2010-sketch/pronosticos-bot)"})
          ultimo = None
          for intento in range(3):          # un fallo suelto de red no es un aviso
              try:
                  salud = json.load(urllib.request.urlopen(pedido, timeout=20))
                  break
              except urllib.error.HTTPError as e:
                  ultimo = f"HTTP {e.code}: {e.read()[:200]!r}"
                  time.sleep(20)
              except Exception as e:
                  ultimo = e
                  time.sleep(20)
          else:
              sys.exit(f"{url} no responde: {ultimo}")

          estado = salud.get("estado")
          ultima = salud.get("ultima_actualizacion")
          edad = None
          if ultima:
              edad = (datetime.now(timezone.utc) - datetime.fromisoformat(ultima)).total_seconds() / 60
          seguidas, hoy = salud.get("muertes") or 0, salud.get("muertes_hoy") or 0
          tiros = salud.get("tiros") or {}
          horas_tiros = None
          if tiros.get("desde"):
              horas_tiros = (datetime.now(timezone.utc) - datetime.fromisoformat(tiros["desde"])).total_seconds() / 3600
          linea = (f"estado {estado}, {salud.get('total')} partidos, última actualización hace {edad and round(edad)} min; "
                   f"pasadas muertas: {seguidas} seguidas y {hoy} hoy; CSV de tiros que fallan: {tiros.get('fallan') or 0}"
                   + (f", desde hace {round(horas_tiros)} h" if horas_tiros is not None else ""))
          print(linea)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(linea + "\n")
          problemas = []
          # el cron pasa cada 25 min con la web al día: 90 sin pasar es que algo va mal
          if estado == "error" or edad is None or edad > 90:
              problemas.append("la web no se está actualizando")
          # una pasada muerta suelta se tolera (hace la mitad y sigue); varias, no
          if seguidas >= 2 or hoy >= 3:
              problemas.append("el cron se queda sin tiempo de CPU")
          # un fallo suelto se reintenta a las 6 h; un día entero es que algo cambió
          if horas_tiros is not None and horas_tiros > 24:
              problemas.append("los tiros a puerta de football-data.co.uk no se bajan")
          if problemas:
              sys.exit("; ".join(problemas) + ": " + linea)
          EOF
