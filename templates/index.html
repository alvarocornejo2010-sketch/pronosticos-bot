<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Pronósticos 1X2 y doble oportunidad de LaLiga, Premier League, Ligue 1 y Bundesliga con un modelo Poisson de fuerzas ataque/defensa.">
<meta name="theme-color" content="#0d1210">
<meta name="color-scheme" content="dark">
<title>Pronósticos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1210'/%3E%3Crect x='3' y='8.5' width='7.6' height='15' rx='1.6' fill='%23e8c468'/%3E%3Crect x='12.2' y='8.5' width='7.6' height='15' rx='1.6' fill='%238b7a46'/%3E%3Crect x='21.4' y='8.5' width='7.6' height='15' rx='1.6' fill='%23575134'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  /* ================================================================
     TERMINAL DE PRONÓSTICOS
     Paneles de borde a borde separados por líneas finas, como una
     terminal de datos: el ancho de la pantalla se convierte en columnas,
     no en márgenes. Inspiración por pieza:
       - tabla con celdas 1/X/2 teñidas: predicciones de FiveThirtyEight
       - mapa de la ventana: mapas de calor de finviz
       - tira de fechas con mini barras: calendarios de tarifas de vuelos
       - barra de estado inferior: VS Code
       - cinta de próximos partidos: rótulos de TV deportiva
     Color con trabajo asignado, nunca decorativo:
       - arena (--cal) = probabilidad. Escala secuencial de 8 tramos,
         monótona en luminosidad y validada; nada más usa ese tono.
       - 4 tintes de liga, validados para pares adyacentes en orden fijo
         (LaLiga, Premier, Ligue 1, Bundesliga). Ninguna combinación de 4
         pasa cuando cualquier liga puede quedar junto a cualquier otra,
         así que la identidad de liga va SIEMPRE en texto (ESP, ENG...) y
         el tinte solo acompaña en listas de orden fijo.
       - estado (error) con icono y texto, nunca color solo.
     ================================================================ */
  :root {
    --fondo: #0d1210;
    --panel: #121a17;
    --panel-alto: #18221e;
    --panel-hondo: #0f1513;
    --linea: #223029;
    --linea-viva: #2f4038;

    --tinta: #edf2ee;
    --tinta-2: #b4c2b9;
    --tinta-3: #84948a;
    --oscura: #0d1210;

    --cal: #e8c468;

    /* paleta de liga: validada con el script de dataviz, orden adyacente */
    --liga-PD: #e66767;
    --liga-PL: #9085e9;
    --liga-FL1: #199e70;
    --liga-BL1: #d95926;

    --critico: #d03b3b;

    /* rampa neutra para recuentos (calendario): no usa el arena, que es probabilidad */
    --n1: #1a2420;
    --n2: #22302a;
    --n3: #2c3d35;
    --n4: #3a4f45;

    --t-11: 0.6875rem;
    --t-12: 0.75rem;
    --t-13: 0.8125rem;
    --t-14: 0.875rem;
    --t-16: 1rem;
    --t-20: 1.25rem;

    --ancho-izq: 15.5rem;
    --ancho-der: clamp(18.75rem, 24vw, 28.75rem);
    --alto-cab: 3.25rem;
    --alto-estado: 1.625rem;
    --col-liga: 2.625rem;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  /* en monitores de 27" a 2560 px todo crece un poco: las medidas están en rem */
  @media (min-width: 2200px) { html { font-size: 112.5%; } }

  body {
    margin: 0;
    font-family: "Archivo", "Archivo Variable", "Segoe UI", system-ui, sans-serif;
    font-size: var(--t-14);
    line-height: 1.4;
    background: var(--fondo);
    color: var(--tinta);
  }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: -2px; }

  .salto { position: absolute; left: -9999px; z-index: 20; background: var(--tinta); color: var(--oscura);
           padding: 8px 14px; font-weight: 600; }
  .salto:focus { left: 12px; top: 8px; }

  .num { font-variant-numeric: tabular-nums; }

  /* ================================================================
     ESQUELETO
     Escritorio: aplicación de altura fija, cada panel con su propio
     desplazamiento. Móvil: documento normal, cabecera pegajosa y pestañas
     abajo, que en el teléfono se desplaza mejor la página que un panel.
     ================================================================ */
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "cab" "centro";
    min-height: 100dvh;
  }
  .cab { grid-area: cab; }
  .centro { grid-area: centro; min-width: 0; }
  .lateral { display: none; }
  .pane-izq, .pane-der { min-width: 0; }
  .estado-barra { display: none; }

  @media (min-width: 880px) {
    .app {
      height: 100dvh;
      grid-template-columns: minmax(0, 1fr) var(--ancho-der);
      grid-template-rows: var(--alto-cab) minmax(0, 1fr) var(--alto-estado);
      grid-template-areas: "cab cab" "centro lat" "estado estado";
    }
    .centro { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--linea); }
    .lateral { display: block; grid-area: lat; overflow-y: auto; min-height: 0; scrollbar-width: thin; background: var(--panel); }
    .lateral { display: flex; flex-direction: column; }
    .pane-izq, .pane-der { display: contents; }
    .m-ligas { order: 1; } .m-mapa { order: 2; } .m-confianza { order: 3; }
    .m-fiab { order: 4; } .m-cal { order: 5; } .m-leyenda { order: 6; }
    .estado-barra { display: flex; grid-area: estado; }
    .pestanas { display: none !important; }
  }
  @media (min-width: 1180px) {
    .app {
      grid-template-columns: var(--ancho-izq) minmax(0, 1fr) var(--ancho-der);
      grid-template-areas: "cab cab cab" "izq centro der" "estado estado estado";
    }
    /* el envoltorio desaparece y cada panel ocupa su propia columna */
    .lateral { display: contents; }
    .pane-izq, .pane-der { display: block; overflow-y: auto; min-height: 0; scrollbar-width: thin; background: var(--panel); }
    .pane-izq { grid-area: izq; border-bottom: 0; border-right: 1px solid var(--linea); }
    .pane-der { grid-area: der; }
  }

  /* ---------------- cabecera ---------------- */
  .cab {
    position: sticky; top: 0; z-index: 6;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--fondo); border-bottom: 1px solid var(--linea);
  }
  @media (min-width: 880px) {
    .cab { position: static; flex-wrap: nowrap; padding: 0 14px 0 16px; height: var(--alto-cab); }
  }

  .marca { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--tinta); flex-shrink: 0; }
  .marca svg { display: block; }
  .marca .nombre { font-size: 1.0625rem; font-weight: 760; font-stretch: 78%; letter-spacing: -0.015em; }

  .buscar {
    order: 3; flex: 1 1 100%;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 4px;
    padding: 0 8px 0 10px; height: 36px; color: var(--tinta-3);
  }
  .buscar:focus-within { border-color: var(--tinta-3); }
  .buscar input {
    flex: 1; min-width: 0; background: none; border: 0; color: var(--tinta);
    font: inherit; font-size: var(--t-14); outline: none; height: 100%;
  }
  .buscar input::placeholder { color: var(--tinta-3); }
  .buscar input::-webkit-search-cancel-button { filter: invert(0.6); }
  kbd {
    font: inherit; font-size: var(--t-11); font-weight: 600; color: var(--tinta-3);
    border: 1px solid var(--linea-viva); border-radius: 3px; padding: 0 5px; line-height: 16px;
  }
  .buscar kbd { display: none; }
  @media (min-width: 880px) {
    .buscar { order: 0; flex: 0 1 300px; height: 32px; }
    .buscar kbd { display: inline; }
  }

  /* cinta de próximos: lo que se juega primero, con cuenta atrás */
  .proximos { display: none; }
  @media (min-width: 880px) {
    .proximos {
      display: flex; flex: 1; min-width: 0; height: var(--alto-cab);
      flex-wrap: wrap; overflow: hidden; align-content: flex-start;
      border-left: 1px solid var(--linea); margin-left: 4px;
    }
  }
  .proximos .rotulo-cinta {
    display: flex; align-items: center; height: var(--alto-cab); padding: 0 12px;
    font-size: var(--t-12); font-weight: 600; color: var(--tinta-3);
  }
  .prox {
    display: flex; align-items: center; gap: 8px; height: var(--alto-cab);
    padding: 0 14px; border: 0; border-left: 1px solid var(--linea); background: none; cursor: pointer;
    font-size: var(--t-13); white-space: nowrap;
  }
  .prox:hover { background: var(--panel); }
  .prox .cuando { color: var(--tinta-3); font-size: var(--t-12); }
  .prox .quienes { font-weight: 600; font-stretch: 88%; letter-spacing: 0.01em; }

  .estado-corto { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: var(--t-12); color: var(--tinta-3); }
  @media (min-width: 880px) { .estado-corto { display: none; } }

  .punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--tinta-3); }
  [data-modo="trabajando"] .punto { background: var(--tinta); animation: latido 1.6s ease-in-out infinite; }
  [data-modo="pausa"] .punto { background: none; box-shadow: inset 0 0 0 1.5px var(--tinta-2); }
  [data-modo="reposo"] .punto { background: var(--tinta-3); }
  [data-modo="error"] .punto { background: var(--critico); }
  @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ---------------- centro ---------------- */
  .centro { container-type: inline-size; container-name: centro; background: var(--panel-hondo); }

  .carril {
    display: flex; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--linea); background: var(--fondo);
  }
  .carril::-webkit-scrollbar { display: none; }

  /* tira de fechas a lo calendario de tarifas: cada día dice cuántos partidos
     tiene y, con una barrita por partido, cómo de claros son */
  .dia-celda {
    flex: 1 1 0; min-width: 5.25rem;
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
    align-items: end; gap: 0 10px; text-align: left;
    padding: 9px 12px 10px; border: 0; border-right: 1px solid var(--linea);
    background: none; cursor: pointer; color: var(--tinta-2);
    box-shadow: inset 0 -2px 0 transparent; overflow: hidden; min-width: 0;
  }
  .dia-celda:hover { background: var(--panel); }
  .dia-celda[aria-current="true"] { background: var(--panel); color: var(--tinta); box-shadow: inset 0 -2px 0 var(--tinta); }
  .dia-celda .dow { grid-column: 1; font-size: var(--t-12); font-weight: 500; }
  .dia-celda .fecha { grid-column: 1; font-size: var(--t-20); font-weight: 650; font-stretch: 85%; line-height: 1.05; letter-spacing: -0.01em; }
  .dia-celda .fecha small { font-size: var(--t-12); font-weight: 500; color: var(--tinta-3); margin-left: 3px; letter-spacing: 0; }
  .dia-celda .cuantos { grid-column: 2; grid-row: 1; justify-self: end; font-size: var(--t-11); color: var(--tinta-3); }
  .dia-celda .forma { grid-column: 2; grid-row: 2; justify-self: end; display: flex; align-items: flex-end; gap: 1px; height: 18px;
                      max-width: 100%; overflow: hidden; }
  .dia-celda .forma i { display: block; width: 3px; border-radius: 1px 1px 0 0; }
  @media (max-width: 879px) {
    .dia-celda { flex: 0 0 auto; width: 6.25rem; padding: 6px 10px 7px; }
    .dia-celda .fecha { font-size: var(--t-16); }
    .dia-celda .forma { height: 14px; }
  }

  .herramientas {
    display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--linea);
  }
  .titulo-vista { font-size: var(--t-16); font-weight: 650; font-stretch: 90%; margin: 0; letter-spacing: -0.01em; }
  .titulo-vista small { font-size: var(--t-12); font-weight: 500; color: var(--tinta-3); margin-left: 6px; letter-spacing: 0; }
  @media (max-width: 879px) {
    .herramientas { flex-wrap: nowrap; padding: 8px 14px; }
    .titulo-vista { font-size: var(--t-14); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .titulo-vista small { display: none; }
  }

  .segmentos { display: flex; margin-left: auto; border: 1px solid var(--linea-viva); border-radius: 4px; overflow: hidden; }
  .segmentos button {
    border: 0; background: none; cursor: pointer; padding: 5px 11px;
    font-size: var(--t-12); font-weight: 500; color: var(--tinta-3);
  }
  .segmentos button + button { border-left: 1px solid var(--linea-viva); }
  .segmentos button:hover { color: var(--tinta); }
  .segmentos button[aria-pressed="true"] { background: var(--panel-alto); color: var(--tinta); font-weight: 600; }

  .segmentos:empty { display: none; }
  .app.sin-datos .cab-tabla, .app.sin-datos .carril { display: none; }
  .app.sin-datos .buscar { visibility: hidden; }

  .limpiar { border: 1px solid var(--linea-viva); border-radius: 4px; background: none; cursor: pointer;
             padding: 4px 10px; font-size: var(--t-12); color: var(--tinta-2); }
  .limpiar:hover { color: var(--tinta); }

  /* ligas en tira: solo en móvil, donde no hay carril lateral */
  .tira-ligas { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--linea); }
  .tira-ligas::-webkit-scrollbar { display: none; }
  @media (min-width: 880px) { .tira-ligas { display: none; } }
  .tira-ligas button {
    flex-shrink: 0; display: flex; align-items: center; gap: 7px;
    border: 0; border-right: 1px solid var(--linea); background: none; cursor: pointer;
    padding: 10px 14px; font-size: var(--t-13); color: var(--tinta-2);
    box-shadow: inset 0 -2px 0 transparent;
  }
  .tira-ligas button[aria-current="true"] { color: var(--tinta); font-weight: 600; box-shadow: inset 0 -2px 0 var(--tinta); }
  .tira-ligas .n { color: var(--tinta-3); font-size: var(--t-12); }

  .centro:not(.mezcla) { --col-liga: 0px; }
  .centro:not(.mezcla) .c-liga { visibility: hidden; }

  .muestra-tono { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; background: var(--tono, var(--tinta-3)); }

  .banda {
    display: flex; gap: 9px; align-items: flex-start; padding: 9px 14px;
    border-bottom: 1px solid var(--linea); font-size: var(--t-13); color: var(--tinta-2); background: var(--fondo);
  }
  .banda b { color: var(--tinta); font-weight: 600; }
  .banda svg { flex-shrink: 0; margin-top: 2px; }
  .banda.error svg { color: var(--critico); }
  @media (min-width: 880px) { .banda { display: none; } }

  /* ---------------- tabla ---------------- */
  .vista { min-height: 0; }
  @media (min-width: 880px) { .vista { flex: 1; overflow-y: auto; scrollbar-width: thin; } }

  .cab-tabla { display: none; }

  .grupo {
    position: sticky; top: var(--pega, 0px); z-index: 2;
    display: flex; align-items: center; gap: 9px;
    padding: 7px 14px 6px; background: var(--fondo);
    border-bottom: 1px solid var(--linea); border-top: 1px solid var(--linea); margin-top: -1px;
    font-size: var(--t-12); font-weight: 600; color: var(--tinta-2);
  }
  .grupo .g-nom { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .grupo .cuenta { font-weight: 500; color: var(--tinta-3); }
  .grupo.dia { font-size: var(--t-13); color: var(--tinta); }
  /* en compacto la cabecera usa la rejilla de la fila para rotular 1 X 2 encima de las celdas */
  @container centro (max-width: 639px) {
    .grupo { display: grid; grid-template-columns: 2.875rem minmax(0, 1fr) 2.25rem 2.25rem 2.25rem; gap: 0 2px; }
    .grupo .g-nom { grid-column: 1 / 3; }
    .grupo .g-col { text-align: center; font-size: var(--t-11); color: var(--tinta-3); }
  }
  @container centro (min-width: 640px) {
    .grupo .g-nom { flex: 1; }
    .grupo .g-col { display: none; }
  }

  .partido { border-bottom: 1px solid var(--linea); }

  /* ---- fila compacta (por defecto: el panel central es estrecho) ---- */
  /* la misma tira 1 X 2 que la tabla de escritorio, a la derecha y centrada entre
     los dos equipos: dos líneas por partido en vez de tres */
  .fila {
    display: grid; width: 100%; text-align: left; cursor: pointer;
    grid-template-columns: 2.875rem minmax(0, 1fr) 2.25rem 2.25rem 2.25rem;
    grid-template-areas:
      "hora local  p1 px p2"
      "liga visita p1 px p2";
    gap: 3px 2px; align-items: center;
    padding: 9px 14px; border: 0; background: none;
  }
  .fila:hover { background: var(--panel); }
  .c-hora { grid-area: hora; display: flex; flex-direction: column; align-self: start; padding-top: 2px; }
  .c-hora .hh { font-size: var(--t-13); font-weight: 600; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  .c-hora .dd { font-size: var(--t-11); color: var(--tinta-3); white-space: nowrap; }
  .c-liga { grid-area: liga; align-self: start; font-size: var(--t-11); font-weight: 700; color: var(--tinta-3); letter-spacing: 0.02em; }
  .c-local { grid-area: local; }
  .c-visita { grid-area: visita; }
  .c-1 { grid-area: p1; }
  .c-x { grid-area: px; }
  .c-2 { grid-area: p2; }
  .c-d, .c-xg, .c-m, .c-rep { display: none; }

  .c-eq { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 8px; }
  .partido.pendiente .c-eq .nom { color: var(--tinta-3); }
  .c-eq .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               font-size: var(--t-14); font-weight: 500; color: var(--tinta-2); font-stretch: 92%; }
  .c-eq.gana .nom { color: var(--tinta); font-weight: 650; }

  .escudo { flex-shrink: 0; width: 18px; height: 18px; display: grid; place-items: center; }
  .escudo img { width: 18px; height: 18px; object-fit: contain; display: block; }
  .escudo.mono { border-radius: 50%; background: var(--linea-viva); color: var(--tinta-2);
                 font-size: 0.625rem; font-weight: 700; font-stretch: 85%; }

  /* celda de probabilidad: fondo del tramo de la escala, tinta elegida por luminancia */
  .c-p {
    display: grid; place-items: center; height: 1.75rem; border-radius: 3px;
    background: var(--bg); color: var(--fg);
    font-size: var(--t-13); font-weight: 650; font-variant-numeric: tabular-nums;
  }
  .c-p.gana { font-weight: 800; }
  .c-p.nada { background: var(--panel); color: var(--tinta-3); font-weight: 500; }

  /* ---- tabla: el panel central ya tiene ancho para una línea por partido ---- */
  @container centro (min-width: 640px) {
    .cab-tabla, .fila {
      grid-template-areas: none;
      grid-template-columns: 3.5rem var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.125rem 3.125rem 3.125rem;
      gap: 0 2px; align-items: stretch;
    }
    .cab-tabla {
      display: grid; padding: 0 14px; background: var(--fondo); border-bottom: 1px solid var(--linea);
      font-size: var(--t-11); font-weight: 600; color: var(--tinta-3);
    }
    .cab-tabla span { padding: 6px 0; }
    .cab-tabla .der { text-align: center; }
    .fila { padding: 0 14px; min-height: 36px; }
    .fila > *, .cab-tabla > * { grid-area: auto; align-self: center; }
    .c-hora, .c-liga { align-self: center; padding-top: 0; }
    .c-hora { flex-direction: row; align-items: baseline; gap: 6px; }
    .c-eq { padding-right: 10px; }
    .c-eq .nom { font-size: var(--t-13); }
    .c-p { align-self: stretch; justify-self: stretch; height: auto; border-radius: 0; }
  }
  @container centro (min-width: 800px) {
    .cab-tabla, .fila {
      grid-template-columns: 3.5rem var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.125rem 3.125rem 3.125rem
                             2.875rem 2.875rem 2.875rem 5.25rem 4rem;
    }
    .c-d, .c-xg, .c-m { display: grid; place-items: center; font-size: var(--t-12); color: var(--tinta-3); font-variant-numeric: tabular-nums; }
    .c-d { color: var(--tinta-2); }
    .c-m.poca { display: flex; justify-content: center; align-items: center; gap: 4px; color: var(--tinta); }
  }
  @container centro (min-width: 1150px) {
    .cab-tabla, .fila {
      grid-template-columns: 3.5rem var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.125rem 3.125rem 3.125rem
                             2.875rem 2.875rem 2.875rem 5.25rem 4rem 11.875rem;
    }
    .c-rep { display: flex; align-items: center; gap: 2px; height: 8px; padding-left: 12px; }
    .c-rep i { display: block; height: 8px; min-width: 2px; }

  /* ---- detalle desplegado ---- */

  .vacio { padding: 36px 18px; max-width: 560px; }

  .vacio .pasos b { color: var(--tinta); font-weight: 600; min-width: 92px; }

  /* ---------------- paneles laterales ---------------- */
  .modulo { padding: 14px 14px 16px; border-bottom: 1px solid var(--linea); }
  .modulo h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px;
               font-size: var(--t-13); font-weight: 650; color: var(--tinta); font-stretch: 92%; }

  .modulo .nota { margin: 10px 0 0; font-size: var(--t-11); color: var(--tinta-3); }

  .leyenda-escala { display: flex; gap: 2px; }

  .leyenda-escala i { display: block; height: 12px; border-radius: 1px; }
  .leyenda-tabla { margin: 12px 0 0; display: grid; gap: 7px; font-size: var(--t-12); }
  .leyenda-tabla div { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .leyenda-tabla dt { display: flex; align-items: center; gap: 4px; font-weight: 650; color: var(--tinta); }
  .leyenda-tabla dd { margin: 0; color: var(--tinta-2); }

  .liga-fila {
    display: grid; grid-template-columns: 8px 34px minmax(0, 1fr) auto; align-items: center; gap: 2px 9px;
    width: 100%; text-align: left; border: 0; background: none; cursor: pointer;

  }
  .liga-fila:hover { background: var(--panel-alto); }

  .liga-fila .sig { font-size: var(--t-11); font-weight: 700; color: var(--tinta-3); letter-spacing: 0.02em; }
  .liga-fila .nom { font-size: var(--t-13); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liga-fila .n { font-size: var(--t-12); color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  .liga-fila .sig:empty { display: none; }

  .fiab { display: grid; grid-template-columns: 34px minmax(0, 1fr) 46px 40px; align-items: center; gap: 0 9px;
          padding: 6px 0; font-size: var(--t-12); }

  .fiab .eje { position: relative; height: 10px; }
  .fiab .eje::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--linea-viva); }
  .fiab .eje i { position: absolute; top: 1px; height: 8px; background: var(--tinta-2); }
  .fiab .eje i.neg { background: var(--tinta-3); }
  .fiab .val { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .fiab .acierto { text-align: right; color: var(--tinta-3); font-variant-numeric: tabular-nums; }
  .fiab-cab { display: grid; grid-template-columns: 34px minmax(0, 1fr) 46px 40px; gap: 0 9px;
              font-size: var(--t-11); color: var(--tinta-3); padding-bottom: 4px; border-bottom: 1px solid var(--linea); }
  .fiab-cab span:nth-child(3), .fiab-cab span:nth-child(4) { text-align: right; }

  /* mapa de la ventana: una columna por día, una baldosa por partido */
  .mapa { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 2px; }
  .mapa-col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .baldosa .q { font-size: 0.625rem; font-weight: 700; font-stretch: 80%; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .baldosa .v { font-size: var(--t-12); font-weight: 750; font-variant-numeric: tabular-nums; }

  .leyenda { display: flex; align-items: flex-end; gap: 2px; margin-top: 10px; }

  .histo button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;

  .histo button:hover i, .histo button:focus-visible i { background: var(--tinta); }
  .histo-eje { display: flex; gap: 2px; margin-top: 4px; }

  .calendario .mes { font-size: var(--t-12); font-weight: 600; color: var(--tinta-2); margin: 0 0 6px; }
  .calendario .mes + .rej { margin-bottom: 12px; }
  .rej { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .rej .dow { font-size: 0.625rem; color: var(--tinta-3); text-align: center; padding-bottom: 2px; }
  .rej .d {
    height: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 0; border-radius: 2px; background: none; padding: 0;

  .rej .d.con { opacity: 1; cursor: pointer; color: var(--tinta); font-weight: 600; background: var(--bgn); }
  .rej .d.con:hover { box-shadow: inset 0 0 0 1px var(--tinta-3); }
  .rej .d .k { font-size: 0.5625rem; font-weight: 500; color: var(--tinta-2); line-height: 1; }
  .rej .d[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--tinta); }
  .rej .d.hoy::after { content: ""; width: 10px; height: 2px; background: var(--tinta-2); margin-top: 2px; }

  /* tooltip único, posicionado al vuelo */
  .tip {
    position: fixed; z-index: 30; pointer-events: none; max-width: 260px;
    background: var(--tinta); color: var(--oscura); border-radius: 4px; padding: 7px 9px;
    font-size: var(--t-12); line-height: 1.35; white-space: pre-line; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  /* ---------------- barra de estado ---------------- */
  .estado-barra {
    align-items: stretch; background: var(--fondo); border-top: 1px solid var(--linea);
    font-size: var(--t-12); color: var(--tinta-3); overflow: hidden; white-space: nowrap;

  .estado-barra > span { display: flex; align-items: center; gap: 7px; padding: 0 12px; border-right: 1px solid var(--linea); }
  .estado-barra .der { margin-left: auto; border-right: 0; border-left: 1px solid var(--linea); }
  .estado-barra b { color: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .estado-barra .medidor { width: 90px; height: 4px; background: var(--linea-viva); border-radius: 2px; overflow: hidden; }
  .estado-barra .medidor i { display: block; height: 100%; background: var(--tinta-2); }
  .estado-barra .err { color: var(--tinta); }
  .estado-barra .err svg { color: var(--critico); }

  /* ---------------- pestañas (móvil) ---------------- */
  .pestanas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(3, 1fr);

  .pestanas button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;

  }
  .pestanas button[aria-current="true"] { color: var(--tinta); }
  @media (max-width: 879px) {
    body { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
    .app[data-pestana="partidos"] .lateral { display: none; }
    .app[data-pestana="panorama"] .centro,
    .app[data-pestana="ligas"] .centro { display: none; }
    .app[data-pestana="panorama"] .lateral,
    .app[data-pestana="ligas"] .lateral { display: block; grid-area: centro; background: var(--panel); }
    .app[data-pestana="panorama"] .pane-izq { display: none; }
    .app[data-pestana="ligas"] .pane-der { display: none; }
    .grupo { --pega: var(--alto-cab-movil, 0px); }

  @media (prefers-reduced-motion: no-preference) {
    .fila, .dia-celda, .prox, .liga-fila, .segmentos button, .baldosa { transition: background-color 0.15s ease, box-shadow 0.15s ease; }
  }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none !important; } }

<body>
<a class="salto" href="#vista">Saltar a los partidos</a>

<div class="app" data-pestana="partidos">
  <header class="cab" id="cab">

<script>
const $ = (id) => document.getElementById(id);
const app = document.querySelector(".app");
const cab = $("cab");
const vista = $("vista");
const fechasEl = $("fechas");
const bandaEl = $("banda");
const tiraLigasEl = $("tira-ligas");
const ordenEl = $("orden");
const tituloEl = $("titulo-vista");
const centroEl = document.querySelector(".centro");
// En escritorio sobra sitio para toda la ventana de golpe; en el móvil se abre en el primer día.
const mqEscritorio = window.matchMedia("(min-width: 880px)");
const limpiarHueco = $("limpiar-hueco");
const paneLigas = $("pane-ligas");
const panePan = $("pane-panorama");
const proximosEl = $("proximos");
const estadoBarra = $("estado-barra");
const estadoCorto = $("estado-corto");
const inputBuscar = $("buscador");
const tip = $("tip");

let datos = null;        // último /api/estado
let validacion = null;   // /api/validacion: puede no haberse ejecutado nunca
let infoLigas = null;    // /api/ligas: medias de goles que usa el modelo
let rutaPintada = null;
let orden = "hora";
let busqueda = "";
const abiertos = new Set();
const escudosRotos = new Set();

// Identidad de liga: la SIGLA es el canal principal. El tinte acompaña solo en
// listas de orden fijo (carril de ligas, cabeceras de grupo): con cuatro ligas
// ninguna paleta pasa la prueba de todos-los-pares, así que donde cualquier liga
// puede quedar junto a cualquier otra (tabla ordenada, mapa) no se usa color.
const LIGAS = {
  PD:  { sigla: "ESP", tono: "var(--liga-PD)" },
  PL:  { sigla: "ENG", tono: "var(--liga-PL)" },
  FL1: { sigla: "FRA", tono: "var(--liga-FL1)" },
  BL1: { sigla: "ALE", tono: "var(--liga-BL1)" },
};
const ORDEN_LIGAS = Object.keys(LIGAS);
function ligaDe(cod) {
  return LIGAS[cod] || { sigla: (cod || "?").slice(0, 3).toUpperCase(), tono: "var(--tinta-3)" };
}

// Escala secuencial de probabilidad: un solo tono (arena), 8 tramos monótonos en
// luminosidad y tinta elegida por contraste (todos >= 5:1). El tramo se decide
// con el entero que se enseña, para que una celda que dice 60 caiga en 60-70.
const RAMPA = [
  { min: 0,  bg: "#1d231c", fg: "var(--tinta)" },
  { min: 20, bg: "#2b2f23", fg: "var(--tinta)" },
  { min: 30, bg: "#3e3e2b", fg: "var(--tinta)" },
  { min: 40, bg: "#575134", fg: "var(--tinta)" },
  { min: 50, bg: "#70653e", fg: "var(--tinta)" },
  { min: 60, bg: "#a18c50", fg: "var(--oscura)" },
  { min: 70, bg: "#c4a85c", fg: "var(--oscura)" },
  { min: 80, bg: "#e8c468", fg: "var(--oscura)" },
];
function tramo(v) {
  let t = RAMPA[0];
  for (const r of RAMPA) if (v >= r.min) t = r;
  return t;
}
function estiloTramo(v) { const t = tramo(v); return "--bg:" + t.bg + ";--fg:" + t.fg; }

// Rampa neutra para recuentos: el arena queda reservado a probabilidades.
const RAMPA_N = ["var(--n1)", "var(--n2)", "var(--n3)", "var(--n4)"];

// ==========================================
// UTILIDADES
// ==========================================
// Los nombres de equipo vienen de football-data.org, no de nosotros. Todo lo que
// llega de fuera se trata como texto, nunca como HTML.
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(v) { return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, c => ESCAPES[c]); }

function normalizar(v) {
  return String(v || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// OJO: new Date("2026-09-06") se interpreta como medianoche UTC y en Lima cae el día
// anterior. Por eso las fechas se parten a mano en todas partes.
function partes(iso) {
  const p = iso.split("-");
  return { a: Number(p[0]), m: Number(p[1]), d: Number(p[2]) };
}
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const MESES_LARGOS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
                      "septiembre", "octubre", "noviembre", "diciembre"];
function fechaCorta(iso) { const p = partes(iso); return p.d + " " + MESES[p.m - 1]; }
function fechaLarga(iso) { const p = partes(iso); return p.d + " de " + MESES_LARGOS[p.m - 1]; }
function diaCorto(d) { return d.length > 6 ? d.slice(0, 3) : d; }
function pct(v) { return Number(v).toFixed(1) + " %"; }
function f2(v) { return Number(v).toFixed(2); }

function aplanar(dias) {
  const out = [];
  (dias || []).forEach(d => d.partidos.forEach(p =>
    out.push(Object.assign({}, p, { fecha: d.fecha, dia: d.etiqueta }))));
  return out;
}

// El orden es el de LIGAS, no el de aparición en los datos: si no, el carril de
// competiciones se reordena solo conforme van entrando partidos calculados.
function porLigas(partidos) {
  const m = new Map();
  partidos.forEach(p => {
    const cod = p.liga_codigo || p.liga || "?";
    if (!m.has(cod)) m.set(cod, { codigo: cod, nombre: p.liga, partidos: [] });
    m.get(cod).partidos.push(p);
  });
  const pos = c => { const i = ORDEN_LIGAS.indexOf(c); return i < 0 ? 99 : i; };
  return [...m.values()].sort((a, b) => pos(a.codigo) - pos(b.codigo) || a.nombre.localeCompare(b.nombre));
}

function porDias(partidos) {
  const m = new Map();
  partidos.forEach(p => {
    if (!m.has(p.fecha)) m.set(p.fecha, { fecha: p.fecha, etiqueta: p.dia, partidos: [] });
    m.get(p.fecha).partidos.push(p);
  });
  return [...m.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
}

// Nombre corto y sigla de tres letras: vienen de la API desde que la ficha los
// guarda. Hasta que se recalcula una predicción vieja se sacan del nombre.
const PREFIJOS = /^(?:fc|cf|afc|sc|ac|as|rc|rcd|ogc|ssc|vfb|vfl|tsg|sv|1\.|ca|cd|ud|real|club)\s+/i;
function cortoDe(p, lado) { return p[lado + "_corto"] || p[lado] || "?"; }
function siglaDe(p, lado) {
  if (p[lado + "_sigla"]) return p[lado + "_sigla"];
  const n = cortoDe(p, lado).replace(PREFIJOS, "").replace(/[^A-Za-zÀ-ÿ]/g, "");
  return (n.slice(0, 3) || "?").toUpperCase();
}

function htmlEscudo(url, nombre) {
  const ini = esc((nombre || "?").replace(PREFIJOS, "").charAt(0).toUpperCase());
  if (url && /^https:\/\//.test(url) && !escudosRotos.has(url)) {
    return '<span class="escudo" data-ini="' + ini + '"><img src="' + esc(url)
      + '" alt="" width="18" height="18" loading="lazy" decoding="async"></span>';
  }
  return '<span class="escudo mono" aria-hidden="true">' + ini + '</span>';
}

// ==========================================
// PROBABILIDADES
// ==========================================
function favorito(p) { return Math.max(p.prob_local, p.prob_empate, p.prob_visita); }

/** Los tres enteros que se enseñan, sumando 100 exacto. Redondear cada uno por su
 *  cuenta da un 54+24+23 = 101 que canta a la vista. Reparto por resto mayor. */
function reparto(p) {
  const bruto = [p.prob_local, p.prob_empate, p.prob_visita];
  const enteros = bruto.map(Math.floor);
  let faltan = 100 - enteros.reduce((a, b) => a + b, 0);
  const porResto = bruto.map((v, i) => ({ i: i, resto: v - Math.floor(v) })).sort((a, b) => b.resto - a.resto);
  for (let k = 0; k < porResto.length && faltan > 0; k++, faltan--) enteros[porResto[k].i]++;
  return { l: enteros[0], x: enteros[1], v: enteros[2] };
}

function veredictoDe(p) {
  const o = [{ signo: "1", valor: p.prob_local }, { signo: "X", valor: p.prob_empate }, { signo: "2", valor: p.prob_visita }];
  return o.reduce((a, b) => (b.valor > a.valor ? b : a));
}

/** Quién es el favorito, en tres letras: la sigla del equipo o "X" si es el empate. */
function siglaFavorito(p) {
  const g = veredictoDe(p).signo;
  return g === "1" ? siglaDe(p, "local") : g === "2" ? siglaDe(p, "visita") : "X";
}

const ORDENES = {
  hora:    { etiqueta: "Hora",    fn: (a, b) => a.utcDate.localeCompare(b.utcDate) },
  claros:  { etiqueta: "Claros",  fn: (a, b) => favorito(b) - favorito(a) },
  renidos: { etiqueta: "Reñidos", fn: (a, b) => favorito(a) - favorito(b) },
};

function ordenar(lista) {
  if (orden === "hora") return [...lista].sort(ORDENES.hora.fn);
  const con = lista.filter(p => !p.pendiente).sort(ORDENES[orden].fn);
  const sin = lista.filter(p => p.pendiente).sort(ORDENES.hora.fn);
  return [...con, ...sin];
}

// ==========================================
// FILA DE PARTIDO
// ==========================================
const ICONO_AVISO = '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M8 1.5 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>'
  + '<path d="M8 6v3.4M8 11.6v.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>';

function muestraDe(p) {
  const ml = p.muestra_local === undefined ? 99 : p.muestra_local;
  const mv = p.muestra_visita === undefined ? 99 : p.muestra_visita;
  return { l: ml, v: mv, min: Math.min(ml, mv) };
}

function htmlFila(p, ctx, abierto) {
  const L = ligaDe(p.liga_codigo);
  const hora = '<span class="c-hora"><span class="hh">' + esc(p.hora) + '</span>'
    + (ctx.conDia ? '<span class="dd">' + esc(diaCorto(p.dia)) + " " + fechaCorta(p.fecha) + '</span>' : "")
    + '</span>';
  const liga = '<span class="c-liga">' + esc(L.sigla) + '</span>';

  let g = null, r = null;
  if (!p.pendiente) { g = veredictoDe(p).signo; r = reparto(p); }
  const equipo = (lado, signo) => '<span class="c-eq c-' + lado + (g === signo ? " gana" : "") + '">'
    + htmlEscudo(p[lado + "_escudo"], cortoDe(p, lado))
    + '<span class="nom">' + esc(cortoDe(p, lado)) + '</span></span>';

  let celdas, etiqueta;
  if (p.pendiente) {
    celdas = '<span class="c-p c-1 nada">—</span><span class="c-p c-x nada">—</span><span class="c-p c-2 nada">—</span>';
    etiqueta = cortoDe(p, "local") + " contra " + cortoDe(p, "visita") + ", " + p.hora + ". Sin calcular todavía.";
  } else {
    const m = muestraDe(p);
    const ancho = (v) => '<i style="flex:' + v + ';background:' + tramo(v).bg + '"></i>';
    celdas = '<span class="c-p c-1' + (g === "1" ? " gana" : "") + '" style="' + estiloTramo(r.l) + '">' + r.l + '</span>'
      + '<span class="c-p c-x' + (g === "X" ? " gana" : "") + '" style="' + estiloTramo(r.x) + '">' + r.x + '</span>'
      + '<span class="c-p c-2' + (g === "2" ? " gana" : "") + '" style="' + estiloTramo(r.v) + '">' + r.v + '</span>'
      + '<span class="c-d">' + (r.l + r.x) + '</span><span class="c-d">' + (r.x + r.v) + '</span><span class="c-d">' + (r.l + r.v) + '</span>'
      + '<span class="c-xg">' + f2(p.xg_local) + "–" + f2(p.xg_visita) + '</span>'
      + '<span class="c-m' + (m.min < 4 ? " poca" : "") + '">' + (m.min < 4 ? ICONO_AVISO : "") + (m.min >= 99 ? "—" : m.min) + '</span>'
      + '<span class="c-rep" aria-hidden="true">' + ancho(r.l) + ancho(r.x) + ancho(r.v) + '</span>';
    etiqueta = cortoDe(p, "local") + " contra " + cortoDe(p, "visita") + ", " + p.hora + ". Local " + r.l
      + " %, empate " + r.x + " %, visitante " + r.v + " %.";
  }

  return '<button class="fila" data-id="' + esc(p.id) + '" aria-expanded="' + (abierto ? "true" : "false")
    + '" aria-label="' + esc(etiqueta) + '">'
    + hora + liga + equipo("local", "1") + equipo("visita", "2") + celdas + '</button>'
    + (abierto && !p.pendiente ? htmlDetalle(p) : "");
}

function htmlDetalle(p) {
  const m = muestraDe(p);
  const aviso = m.min < 4
    ? '<p class="aviso">' + ICONO_AVISO + '<span>Solo ' + m.min + ' partido' + (m.min === 1 ? "" : "s")
      + ' previo' + (m.min === 1 ? "" : "s") + ' en la muestra: la estimación tira hacia la media de la liga.</span></p>'
    : "";
  const dato = (t, v) => '<div><dt>' + t + '</dt><dd>' + v + '</dd></div>';
  return '<div class="detalle"><dl>'
    + dato("Partido", esc(p.local) + " – " + esc(p.visita))
    + dato("Competición", esc(p.liga) + ", " + esc(p.dia) + " " + fechaLarga(p.fecha) + ", " + esc(p.hora))
    + dato("1 X 2", "local " + pct(p.prob_local) + ", empate " + pct(p.prob_empate) + ", visitante " + pct(p.prob_visita))
    + dato("Doble oportunidad", "1X " + pct(p.prob_1x) + ", X2 " + pct(p.prob_x2) + ", 12 " + pct(p.prob_12))
    + dato("Goles esperados", f2(p.xg_local) + " – " + f2(p.xg_visita))
    + dato("Muestra", m.l + " en casa del local, " + m.v + " fuera del visitante")
    + '</dl>' + aviso + '</div>';
}

/**
 * Pinta bloques tocando el DOM lo mínimo: cada bloque lleva id y huella, y si la
 * huella no cambió no se toca. Así no parpadea ni se pierde el scroll cuando entra
 * una tanda nueva de resultados.
 */
function pintarBloques(cont, items) {
  const vistos = new Set();
  items.forEach((it, i) => {
    vistos.add(it.id);
    let el = document.getElementById(it.id);
    if (!el) { el = document.createElement("div"); el.id = it.id; }
    if (el.dataset.huella !== it.huella) {
      el.dataset.huella = it.huella;
      el.className = it.clase;
      if (it.tono) el.style.setProperty("--tono", it.tono);
      el.innerHTML = it.html;
    }
    if (cont.children[i] !== el) cont.insertBefore(el, cont.children[i] || null);
  });
  [...cont.children].forEach(el => { if (!vistos.has(el.id)) el.remove(); });
}

function bloquesDePartidos(partidos, ctx) {
  return partidos.map(p => {
    const abierto = abiertos.has(String(p.id));
    return {
      id: "p-" + p.id,
      huella: JSON.stringify(p) + "|" + JSON.stringify(ctx) + "|" + abierto + "|" + escudosRotos.size,
      clase: "partido" + (p.pendiente ? " pendiente" : ""),
      html: htmlFila(p, ctx, abierto),
    };
  });
}

function bloqueGrupo(clave, texto, cuenta, tono, clase) {
  return {
    id: "g-" + clave,
    huella: texto + "|" + cuenta + "|" + (tono || ""),
    clase: "grupo" + (clase ? " " + clase : ""),
    tono: tono,
    html: '<span class="g-nom">' + (tono ? '<span class="muestra-tono"></span>' : "") + '<span>' + esc(texto) + '</span>'
      + '<span class="cuenta">' + cuenta + " partido" + (cuenta === 1 ? "" : "s") + '</span></span>'
      + '<span class="g-col">1</span><span class="g-col">X</span><span class="g-col">2</span>',
  };
}

// ==========================================
// RUTAS
//   #/                    el primer día con partidos
//   #/dia/2026-09-12      un día, todas las ligas
//   #/semana              toda la ventana
//   #/liga/PD             una liga entera
//   #/liga/PD/2026-09-12  una liga, un día
// ==========================================
function leerRuta() {
  const t = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean);
  if (t[0] === "liga" && t[1]) return { vista: "liga", liga: decodeURIComponent(t[1]), fecha: t[2] || null };
  if (t[0] === "dia" && t[1]) return { vista: "dia", fecha: t[1] };
  if (t[0] === "semana") return { vista: "semana" };
  return { vista: "inicio" };
}
// Se pinta en el acto: así quien navega (el mapa, la cinta) encuentra la fila ya en
// el DOM. El hashchange que llega después ve la misma ruta y no reconstruye nada.
function irA(hash) {
  if (location.hash !== hash) location.hash = hash;
  render();
}

function primerDia(todos) { const d = porDias(todos); return d.length ? d[0].fecha : ""; }

// ==========================================
// CONTENIDO DEL CENTRO
// ==========================================
function nombreDia(d) {
  const L = d.etiqueta;
  return (L === "Hoy" || L === "Mañana" ? L + ", " : L + " ") + fechaLarga(d.fecha);
}

function bloquesCentro(todos, ruta) {
  // búsqueda: lista plana por hora, con día y liga en cada fila
  if (busqueda) {
    const q = normalizar(busqueda).trim();
    const hallados = todos.filter(p => [p.local, p.visita, p.local_corto, p.visita_corto]
      .some(n => n && normalizar(n).indexOf(q) >= 0));
    return { titulo: "Búsqueda", sub: hallados.length + " partido" + (hallados.length === 1 ? "" : "s"),
             mezcla: true, bloques: bloquesDePartidos(ordenar(hallados), { conDia: true }),
             vacio: hallados.length ? null : ["Ningún partido de «" + busqueda + "»",
               "Solo se buscan los partidos de la ventana actual. Prueba con otra grafía o con el nombre corto del club."] };
  }

  if (ruta.vista === "liga") {
    const suyos = todos.filter(p => (p.liga_codigo || p.liga) === ruta.liga);
    const sel = ruta.fecha ? suyos.filter(p => p.fecha === ruta.fecha) : suyos;
    const nombre = suyos.length ? suyos[0].liga : ruta.liga;
    const out = { titulo: nombre, sub: ruta.fecha ? fechaLarga(ruta.fecha) : "toda la ventana", mezcla: false, bloques: [] };
    if (!sel.length) { out.vacio = ["Nada ese día", "Esta competición no juega en la fecha elegida."]; return out; }
    if (orden !== "hora" || ruta.fecha) {
      out.bloques = bloquesDePartidos(ordenar(sel), { conDia: !ruta.fecha });
      return out;
    }
    porDias(sel).forEach(d => {
      out.bloques.push(bloqueGrupo(d.fecha, nombreDia(d), d.partidos.length, null, "dia"));
      out.bloques.push.apply(out.bloques, bloquesDePartidos(ordenar(d.partidos), { conDia: false }));
    });
    return out;
  }

  if (ruta.vista === "semana" || (ruta.vista === "inicio" && mqEscritorio.matches)) {
    const out = { titulo: "Toda la ventana", sub: todos.length + " partidos", mezcla: true, bloques: [] };
    if (orden !== "hora") { out.bloques = bloquesDePartidos(ordenar(todos), { conDia: true }); return out; }
    porDias(todos).forEach(d => {
      out.bloques.push(bloqueGrupo(d.fecha, nombreDia(d), d.partidos.length, null, "dia"));
      out.bloques.push.apply(out.bloques, bloquesDePartidos(ordenar(d.partidos), { conDia: false }));
    });
    return out;
  }

  // un día, agrupado por competición en orden fijo (aquí el tinte de liga es legítimo)
  const fecha = ruta.vista === "dia" ? ruta.fecha : primerDia(todos);
  const delDia = todos.filter(p => p.fecha === fecha);
  const d0 = porDias(delDia)[0];
  const out = { titulo: d0 ? nombreDia(d0) : "Sin partidos", sub: delDia.length + " partidos", mezcla: false, bloques: [] };
  if (!delDia.length) { out.vacio = ["Nada ese día", "No hay partidos programados en esta fecha."]; return out; }
  if (orden !== "hora") {
    out.mezcla = true;
    out.bloques = bloquesDePartidos(ordenar(delDia), { conDia: false });
    return out;
  }
  porLigas(delDia).forEach(L => {
    out.bloques.push(bloqueGrupo(L.codigo + "-" + fecha, L.nombre, L.partidos.length, ligaDe(L.codigo).tono, "liga"));
    out.bloques.push.apply(out.bloques, bloquesDePartidos(ordenar(L.partidos), { conDia: false }));
  });
  return out;
}

function htmlForma(partidos) {
  // una barrita por partido, alto según la fuerza del favorito, de más a menos claro
  const con = partidos.filter(p => !p.pendiente).map(favorito).sort((a, b) => b - a);
  const sin = partidos.length - con.length;
  return '<span class="forma" aria-hidden="true">'
    + con.map(v => '<i style="height:' + Math.max(3, Math.round((v - 30) / 60 * 18)) + 'px;background:'
        + tramo(Math.round(v)).bg + '"></i>').join("")
    + Array(sin).fill('<i style="height:2px;background:var(--linea-viva)"></i>').join("")
    + '</span>';
}

function pintarFechas(todos, ruta) {
  let conjunto = todos, base = "#/dia/", todoHash = "#/semana", todoTexto = "Semana", sel;
  if (ruta.vista === "liga") {
    conjunto = todos.filter(p => (p.liga_codigo || p.liga) === ruta.liga);
    base = "#/liga/" + encodeURIComponent(ruta.liga) + "/";
    todoHash = "#/liga/" + encodeURIComponent(ruta.liga);
    todoTexto = "Todas";
    sel = ruta.fecha || "";
  } else if (ruta.vista === "semana") sel = "";
  else if (ruta.vista === "dia") sel = ruta.fecha;
  else if (ruta.vista === "inicio") sel = mqEscritorio.matches ? "" : primerDia(todos);
  if (busqueda) sel = null;

  const dias = porDias(conjunto);
  const html = dias.map(d => {
    const p = partes(d.fecha);
    return '<button class="dia-celda" data-hash="' + esc(base + d.fecha) + '" aria-current="' + (sel === d.fecha) + '">'
      + '<span class="dow">' + esc(d.etiqueta === "Hoy" || d.etiqueta === "Mañana" ? d.etiqueta : diaCorto(d.etiqueta)) + '</span>'
      + '<span class="fecha num">' + p.d + '<small>' + MESES[p.m - 1] + '</small></span>'
      + '<span class="cuantos num">' + d.partidos.length + '</span>'
      + htmlForma(d.partidos) + '</button>';
  }).join("")
    + '<button class="dia-celda toda" data-hash="' + esc(todoHash) + '" aria-current="' + (sel === "") + '">'
    + '<span class="dow">' + esc(todoTexto) + '</span><span class="fecha num">' + conjunto.length + '<small>partidos</small></span>'
    + htmlForma(conjunto) + '</button>';
  if (fechasEl.dataset.huella === html) return;
  fechasEl.dataset.huella = html;
  fechasEl.innerHTML = html;
}

function pintarTiraLigas(todos, ruta) {

  const html = '<button data-liga="" aria-current="' + (activa === "") + '">Todas <span class="n num">' + todos.length + '</span></button>'
    + porLigas(todos).map(L => '<button data-liga="' + esc(L.codigo) + '" aria-current="' + (activa === L.codigo)

function pintarOrden() {

    + esc(ORDENES[k].etiqueta) + '</button>').join("");
  if (ordenEl.dataset.huella === html) return;

function htmlFiabilidad() {
  if (!validacion || validacion.estado !== "listo") {
    return '<section class="modulo m-fiab"><h2>Fiabilidad medida</h2><p class="placeholder">'
      + 'Aún no se ha ejecutado la validación del modelo. Se lanza sola cuando el calendario está completo.</p></section>';
  }
  const res = validacion.resumen || {};
  const codigos = ORDEN_LIGAS.filter(c => res[c]).concat(Object.keys(res).filter(c => ORDEN_LIGAS.indexOf(c) < 0));
  if (!codigos.length) return "";
  const tope = Math.max(10, ...codigos.map(c => Math.abs(res[c].skill_score)));
  return '<section class="modulo m-fiab"><h2>Fiabilidad medida <span class="meta">temporada ' + esc(validacion.temporada || "") + '</span></h2>'
    + '<div class="fiab-cab"><span></span><span>Mejora</span><span>Skill</span><span>Acierto</span></div>'
    + codigos.map(c => {
        const r = res[c];
        const det = (validacion.ligas || {})[c] || {};
        const acierto = det.modelo && det.modelo.acierto !== undefined ? Math.round(det.modelo.acierto) + " %" : "—";
        const ancho = Math.abs(r.skill_score) / tope * 50;
        const barra = r.skill_score >= 0
          ? '<i style="left:50%;width:' + ancho + '%"></i>'
          : '<i class="neg" style="left:' + (50 - ancho) + '%;width:' + ancho + '%"></i>';
        return '<div class="fiab"><span class="sig">' + esc(ligaDe(c).sigla) + '</span>'
          + '<span class="eje" title="' + esc(det.liga || c) + '">' + barra + '</span>'
          + '<span class="val">' + (r.skill_score > 0 ? "+" : "") + r.skill_score + '</span>'
          + '<span class="acierto">' + acierto + '</span></div>';
      }).join("")
    + '<p class="nota">Skill score: cuánto Brier le quita el modelo a la base "equipo medio". 0 es no aportar nada.</p></section>';
}

function pintarLigasPane(todos, ruta) {
  const activa = ruta.vista === "liga" ? ruta.liga : "";
  const filas = porLigas(todos).map(L => {
    const i = (infoLigas || {})[L.codigo] || {};
    const stats = i.media_usada_local
      ? "Goles: " + f2(i.media_usada_local) + " en casa, " + f2(i.media_usada_visita) + " fuera" : "";
    const jugados = i.partidos_esta_temporada ? i.partidos_esta_temporada + " partidos jugados esta temporada" : "";
    return '<button class="liga-fila" data-liga="' + esc(L.codigo) + '" aria-current="' + (activa === L.codigo)
      + '" style="--tono:' + ligaDe(L.codigo).tono + '"><span class="muestra-tono"></span>'

      + '<span class="n">' + L.partidos.length + '</span>'
      + (stats ? '<span class="stats" title="' + esc(jugados) + '">' + esc(stats) + '</span>' : "") + '</button>';
  }).join("");
  const fechaSel = busqueda ? "" : ruta.vista === "dia" ? ruta.fecha
    : ruta.vista === "inicio" && !mqEscritorio.matches ? primerDia(todos) : "";
  const html = '<section class="modulo m-ligas"><h2>Competiciones <span class="meta">' + todos.length + ' partidos</span></h2>'
    + '<button class="liga-fila" data-liga="" aria-current="' + (activa === "") + '"><span class="muestra-tono" style="background:var(--tinta-3)"></span>'
    + '<span class="sig"></span><span class="nom">Todas</span><span class="n">' + todos.length + '</span></button>'
    + filas + '</section>' + htmlCalendario(todos, fechaSel) + htmlLeyenda();
  if (paneLigas.dataset.huella === html) return;
  paneLigas.dataset.huella = html;
  paneLigas.innerHTML = html;
}

// ==========================================
// PANEL PANORAMA
// ==========================================
function htmlMapa(todos) {
  const dias = porDias(todos);
  if (!dias.length) return "";
  const cols = dias.map(d => {
    const con = d.partidos.filter(p => !p.pendiente).sort((a, b) => favorito(b) - favorito(a));
    const sin = d.partidos.filter(p => p.pendiente);
    const p0 = partes(d.fecha);
    const dow = d.etiqueta === "Hoy" ? "Hoy" : d.etiqueta.slice(0, 3);
    return '<div class="mapa-col"><span class="cab-col">' + esc(dow) + '<b>' + p0.d + '</b></span>'
      + con.map(p => {
          const v = Math.round(favorito(p));
          const t = tramo(v);
          const txt = cortoDe(p, "local") + " – " + cortoDe(p, "visita") + "\n" + p.liga + ", " + p.hora
            + "\nFavorito: " + (siglaFavorito(p) === "X" ? "empate" : (veredictoDe(p).signo === "1" ? cortoDe(p, "local") : cortoDe(p, "visita")))
            + " " + v + " %";
          return '<button class="baldosa" style="--bg:' + t.bg + ';--fg:' + t.fg + '" data-fecha="' + esc(p.fecha)
            + '" data-id="' + esc(p.id) + '" data-tip="' + esc(txt) + '" aria-label="' + esc(txt.replace(/\n/g, ". ")) + '">'
            + '<span class="q">' + esc(siglaFavorito(p)) + '</span><span class="v">' + v + '</span></button>';
        }).join("")
      + sin.map(p => '<button class="baldosa pend" data-fecha="' + esc(p.fecha) + '" data-id="' + esc(p.id)
          + '" data-tip="' + esc(cortoDe(p, "local") + " – " + cortoDe(p, "visita") + "\nSin calcular todavía")
          + '" aria-label="' + esc(cortoDe(p, "local") + " contra " + cortoDe(p, "visita") + ", sin calcular") + '">'
          + '<span class="q">' + esc(siglaDe(p, "local")) + '</span><span class="v">—</span></button>').join("")
      + '</div>';
  }).join("");
  const leyenda = RAMPA.slice(2).map((r, i) => '<span><i style="background:' + r.bg + '"></i>'
    + (i === RAMPA.length - 3 ? "80+" : r.min) + '</span>').join("");
  return '<section class="modulo m-mapa"><h2>Mapa de la ventana <span class="meta">favorito y su probabilidad</span></h2>'
    + '<div class="mapa">' + cols + '</div><div class="leyenda" aria-hidden="true">' + leyenda + '</div>'
    + '<p class="nota">Cada casilla es un partido: la sigla del favorito ("X" si es el empate) y su probabilidad. Cuanto más clara, más claro el pronóstico.</p></section>';
}

function htmlHistograma(todos) {
  const vals = todos.filter(p => !p.pendiente).map(p => favorito(p));
  if (vals.length < 3) return "";
  // tramos iguales de 5 puntos; el último, abierto
  const bordes = [30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80];
  const cuenta = bordes.map(() => 0);
  vals.forEach(v => {
    let i = bordes.length - 1;
    while (i > 0 && v < bordes[i]) i--;
    cuenta[i]++;
  });
  const max = Math.max(...cuenta);
  const iMax = cuenta.indexOf(max);
  const ord = [...vals].sort((a, b) => a - b);
  const mediana = ord.length % 2 ? ord[(ord.length - 1) / 2] : (ord[ord.length / 2 - 1] + ord[ord.length / 2]) / 2;
  const barras = cuenta.map((c, i) => {
    const rango = i === bordes.length - 1 ? bordes[i] + " % o más" : bordes[i] + "–" + bordes[i + 1] + " %";
    const txt = rango + "\n" + c + " partido" + (c === 1 ? "" : "s");
    return '<button class="' + (i === iMax ? "max" : "") + '" data-tip="' + esc(txt) + '" aria-label="' + esc(txt.replace("\n", ": ")) + '">'
      + (i === iMax ? '<span class="etq">' + c + '</span>' : "")
      + '<i style="height:' + (max ? c / max * 78 : 0) + 'px"></i></button>';
  }).join("");
  const eje = bordes.map((b, i) => '<span>' + (i % 2 === 0 ? (i === bordes.length - 1 ? "80+" : b) : "") + '</span>').join("");
  return '<section class="modulo m-confianza"><h2>Confianza del favorito <span class="meta">mediana ' + Math.round(mediana) + ' %</span></h2>'
    + '<div class="histo">' + barras + '</div><div class="histo-eje" aria-hidden="true">' + eje + '</div>'
    + '<p class="nota">Cuántos partidos tienen un favorito de cada fuerza. A la izquierda, los que son casi una moneda al aire.</p></section>';
}

function htmlLeyenda() {
  const escala = RAMPA.slice(2).map((r, i) => '<span><i style="background:' + r.bg + '"></i>'
    + (i === RAMPA.length - 3 ? "80+" : r.min) + '</span>').join("");
  const fila = (dt, dd) => '<div><dt>' + dt + '</dt><dd>' + dd + '</dd></div>';
  return '<section class="modulo m-leyenda"><h2>Cómo leer la tabla <span class="meta">probabilidad en %</span></h2>'
    + '<div class="leyenda-escala" aria-hidden="true">' + escala + '</div>'
    + '<dl class="leyenda-tabla">'
    + fila("1 X 2", "Local, empate, visitante")
    + fila("1X X2 12", "Doble oportunidad")
    + fila(ICONO_AVISO + " 2", "Muestra corta: menos de 4 partidos previos")
    + fila("—", "Sin calcular todavía")
    + '</dl></section>';
}

const DOW = ["L", "M", "X", "J", "V", "S", "D"];
function htmlCalendario(todos, fechaSel) {
  const dias = porDias(todos);
  if (!dias.length) return "";
  const cuenta = {};
  dias.forEach(d => { cuenta[d.fecha] = d.partidos.length; });
  const hoy = (dias.find(d => d.etiqueta === "Hoy") || {}).fecha || "";
  const maxN = Math.max(...Object.values(cuenta));
  // el mes (o los dos meses) que toca la ventana
  const meses = [];
  dias.forEach(d => { const p = partes(d.fecha); const k = p.a + "-" + p.m; if (meses.indexOf(k) < 0) meses.push(k); });
  return '<section class="modulo calendario m-cal"><h2>Calendario <span class="meta">partidos por día</span></h2>'
    + meses.map(k => {
        const [a, m] = k.split("-").map(Number);
        const primer = (new Date(Date.UTC(a, m - 1, 1)).getUTCDay() + 6) % 7;
        const n = new Date(Date.UTC(a, m, 0)).getUTCDate();
        let celdas = DOW.map(x => '<span class="dow">' + x + '</span>').join("");
        for (let i = 0; i < primer; i++) celdas += '<span></span>';
        for (let d = 1; d <= n; d++) {
          const iso = a + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
          const c = cuenta[iso];
          if (!c) { celdas += '<span class="d">' + d + '</span>'; continue; }
          const paso = Math.min(RAMPA_N.length - 1, Math.floor(c / (maxN + 1) * RAMPA_N.length));
          celdas += '<button class="d con' + (iso === hoy ? " hoy" : "") + '" style="--bgn:' + RAMPA_N[paso] + '" data-hash="#/dia/' + iso
            + '" aria-current="' + (iso === fechaSel) + '" data-tip="' + esc(d + " de " + MESES_LARGOS[m - 1] + "\n" + c + " partido" + (c === 1 ? "" : "s"))
            + '">' + d + '<span class="k">' + c + '</span></button>';
        }
        return '<p class="mes">' + esc(MESES_LARGOS[m - 1].charAt(0).toUpperCase() + MESES_LARGOS[m - 1].slice(1)) + " " + a + '</p>'
          + '<div class="rej">' + celdas + '</div>';
      }).join("")
    + '</section>';
}

function pintarPanorama(todos, ruta) {
  const html = htmlMapa(todos) + htmlHistograma(todos) + htmlFiabilidad();
  if (panePan.dataset.huella === html) return;
  panePan.dataset.huella = html;
  panePan.innerHTML = html;
}

// ==========================================
// CINTA DE PRÓXIMOS
// ==========================================
function cuentaAtras(p) {
  const min = Math.round((Date.parse(p.utcDate) - Date.now()) / 60000);
  if (min < 1) return "ahora";
  if (min < 60) return "en " + min + " min";
  if (min < 24 * 60) return "en " + Math.round(min / 60) + " h";
  return diaCorto(p.dia) + " " + p.hora;
}

function pintarProximos(todos) {
  const ahora = Date.now();
  const prox = todos.filter(p => Date.parse(p.utcDate) > ahora)
    .sort((a, b) => a.utcDate.localeCompare(b.utcDate)).slice(0, 10);
  const html = '<span class="rotulo-cinta">Próximos</span>' + prox.map(p => {
    const chip = p.pendiente ? ""
      : '<span class="c-p" style="' + estiloTramo(Math.round(favorito(p))) + ';height:20px;min-width:0;padding:0 6px">'
        + esc(siglaFavorito(p)) + " " + Math.round(favorito(p)) + '</span>';
    return '<button class="prox" data-fecha="' + esc(p.fecha) + '" data-id="' + esc(p.id) + '" title="'
      + esc(cortoDe(p, "local") + " – " + cortoDe(p, "visita") + ", " + p.liga) + '">'
      + '<span class="cuando">' + esc(cuentaAtras(p)) + '</span>'
      + '<span class="quienes">' + esc(siglaDe(p, "local")) + "–" + esc(siglaDe(p, "visita")) + '</span>' + chip + '</button>';
  }).join("");
  if (proximosEl.dataset.huella === html) return;
  proximosEl.dataset.huella = html;
  proximosEl.innerHTML = html;
}

// ==========================================
// ESTADO
// ==========================================
function haceCuanto(iso) {
  if (!iso) return "—";
  const min = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (min < 1) return "hace un momento";
  if (min < 60) return "hace " + min + " min";
  const h = Math.floor(min / 60);
  return "hace " + h + " h";
}

const ICONO_PAUSA = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.5" height="8" fill="currentColor"></rect><rect x="6" y="1" width="2.5" height="8" fill="currentColor"></rect></svg>';

function pintarEstado() {
  const e = datos.estado;
  const total = datos.total || 0, pend = datos.pendientes || 0, hechos = total - pend;
  const modo = e === "actualizando" || e === "sin_datos" ? "trabajando"
    : e === "parcial" ? "pausa" : e === "error" ? "error" : "reposo";
  const texto = { actualizando: "Calculando", parcial: "En pausa", listo: "Al día", error: "Error",
                  sin_datos: "Esperando la primera actualización", sin_partidos: "Sin partidos en la ventana" }[e] || e;

  // móvil: un punto y lo esencial
  estadoCorto.dataset.modo = modo;
  estadoCorto.querySelector(".txt").textContent = total && pend ? hechos + "/" + total : texto;

  // escritorio: barra de estado a lo editor de código
  let seg = '<span title="' + esc(e === "parcial"
      ? "Se agotó el presupuesto de peticiones de esta pasada; la siguiente sigue por donde se quedó." : texto) + '">'
    + '<span class="punto"></span>' + esc(texto) + (e === "parcial" ? ", faltan " + pend : "") + '</span>';
  if (e === "error") {
    seg += '<span class="err">' + ICONO_AVISO + esc("La última actualización falló: " + (datos.error || "sin detalle")
      + ". Se ven los números de la pasada anterior.") + '</span>';
  }
  if (total) {
    seg += '<span><b>' + hechos + '</b> de <b>' + total + '</b> calculados'
      + (pend ? '<span class="medidor"><i style="width:' + (100 * hechos / total) + '%"></i></span>' : "") + '</span>';
  }
  if (typeof datos.requests_gastadas === "number") {
    seg += '<span><b>' + datos.requests_gastadas + '</b> peticiones en la última pasada</span>';
  }
  if (datos.ultima_actualizacion) seg += '<span>Actualizado ' + esc(haceCuanto(datos.ultima_actualizacion)) + '</span>';
  seg += '<span class="der">Datos de football-data.org</span><span><kbd>/</kbd> buscar</span>';
  estadoBarra.dataset.modo = modo;
  if (estadoBarra.dataset.huella !== seg) { estadoBarra.dataset.huella = seg; estadoBarra.innerHTML = seg; }

  // móvil: la pausa y el error necesitan su línea, que no hay barra de estado
  let banda = "";
  if (e === "parcial") {
    banda = ICONO_PAUSA + '<span><b>Faltan ' + pend + ' por calcular.</b> Entran en la próxima pasada.</span>';
  } else if (e === "error") {
    banda = ICONO_AVISO + '<span><b>La última actualización falló.</b> ' + esc(datos.error || "sin detalle") + '. Se ven los números de la pasada anterior.</span>';
  }
  bandaEl.hidden = !banda;
  bandaEl.className = "banda" + (e === "error" ? " error" : "");
  if (bandaEl.dataset.huella !== banda) { bandaEl.dataset.huella = banda; bandaEl.innerHTML = banda; }
}

// ==========================================
// RENDER
// ==========================================
function estadoVacio() {
  const sinDatos = datos.estado === "sin_datos";
  return '<div class="vacio"><h2>' + (sinDatos ? "Todavía no hay datos" : "No hay partidos en los próximos días") + '</h2>'
    + (sinDatos
      ? '<p>Cada despliegue en Render borra el disco, así que la caché arranca vacía y la primera pasada tiene que bajarlo todo de nuevo.</p>'
        + '<ul class="pasos"><li><b>Ahora</b><span>El planificador interno lanza la actualización sola, sin esperar al siguiente turno.</span></li>'
        + '<li><b>Cada pasada</b><span>Calcula hasta agotar 40 peticiones a la API y deja el resto para la siguiente.</span></li>'
        + '<li><b>Esta página</b><span>Se actualiza sola: los partidos aparecen en cuanto haya números.</span></li></ul>'
      : '<p>Ninguna de las cuatro ligas juega en la ventana consultada. Es lo normal en parones de selecciones.</p>')
    + '</div>';
}

function render() {
  if (!datos) return;
  pintarEstado();

  if (datos.estado === "sin_datos" || datos.estado === "sin_partidos") {
    rutaPintada = null;
    app.classList.add("sin-datos");
    tituloEl.innerHTML = "Pronósticos";
    [fechasEl, tiraLigasEl, ordenEl, proximosEl].forEach(el => { el.innerHTML = ""; el.dataset.huella = ""; });
    vista.innerHTML = estadoVacio();
    const ph = (t) => '<section class="modulo"><h2>' + t + '</h2><p class="placeholder">Se rellena con la primera actualización.</p></section>';
    paneLigas.innerHTML = ph("Competiciones") + ph("Calendario") + htmlLeyenda(); paneLigas.dataset.huella = "";
    panePan.innerHTML = ph("Mapa de la ventana") + ph("Confianza del favorito") + htmlFiabilidad(); panePan.dataset.huella = "";
    return;
  }
  app.classList.remove("sin-datos");

  const todos = aplanar(datos.dias);
  const ruta = leerRuta();
  const clave = JSON.stringify(ruta) + "|" + orden + "|" + (busqueda ? "b" : "") + "|" + mqEscritorio.matches;
  const reconstruir = clave !== rutaPintada;
  rutaPintada = clave;
  if (reconstruir) { vista.innerHTML = ""; vista.scrollTop = 0; }

  pintarFechas(todos, ruta);
  pintarTiraLigas(todos, ruta);
  pintarOrden();

  const c = bloquesCentro(todos, ruta);
  tituloEl.innerHTML = esc(c.titulo) + (c.sub ? '<small>' + esc(c.sub) + '</small>' : "");
  centroEl.classList.toggle("mezcla", !!c.mezcla);
  limpiarHueco.innerHTML = busqueda ? '<button class="limpiar" id="limpiar">Limpiar búsqueda</button>' : "";
  if (c.vacio) {
    vista.innerHTML = '<div class="vacio"><h2>' + esc(c.vacio[0]) + '</h2><p>' + esc(c.vacio[1]) + '</p></div>';
  } else {
    pintarBloques(vista, c.bloques);
  }

  pintarLigasPane(todos, ruta);
  pintarPanorama(todos, ruta);
  pintarProximos(todos);
  medirCabecera();
}

// En móvil la página se desplaza entera y la cabecera es pegajosa: las cabeceras de
// grupo se anclan justo debajo, con su alto real.
function medirCabecera() {
  document.documentElement.style.setProperty("--alto-cab-movil", cab.offsetHeight + "px");
}
window.addEventListener("resize", medirCabecera);

// ==========================================
// INTERACCIÓN
// ==========================================
function ponerPestana(p) {
  app.dataset.pestana = p;
  document.querySelectorAll(".pestanas button").forEach(b => b.setAttribute("aria-current", String(b.dataset.p === p)));
}

function limpiarBusqueda() { busqueda = ""; inputBuscar.value = ""; }

function abrirPartido(fecha, id) {
  limpiarBusqueda();
  abiertos.add(String(id));
  ponerPestana("partidos");
  irA("#/dia/" + fecha);
  const el = document.getElementById("p-" + id);
  if (el) { el.scrollIntoView({ block: "center" }); const b = el.querySelector(".fila"); if (b) b.focus({ preventScroll: true }); }
}

// Delegación: un solo listener que sobrevive a cualquier repintado.
document.addEventListener("click", (e) => {
  const t = e.target;
  const pest = t.closest(".pestanas button");
  if (pest) { ponerPestana(pest.dataset.p); window.scrollTo(0, 0); return; }

  const liga = t.closest("[data-liga]");
  if (liga && (liga.classList.contains("liga-fila") || liga.closest(".tira-ligas"))) {
    limpiarBusqueda(); ponerPestana("partidos");
    irA(liga.dataset.liga ? "#/liga/" + encodeURIComponent(liga.dataset.liga) : "#/");
    return;
  }
  const conHash = t.closest("[data-hash]");
  if (conHash) { limpiarBusqueda(); ponerPestana("partidos"); irA(conHash.dataset.hash); return; }

  const ord = t.closest("[data-orden]");
  if (ord) { orden = ord.dataset.orden; rutaPintada = null; render(); return; }

  if (t.closest("#limpiar")) { limpiarBusqueda(); rutaPintada = null; render(); inputBuscar.focus(); return; }

  const salto = t.closest(".baldosa, .prox");
  if (salto) { abrirPartido(salto.dataset.fecha, salto.dataset.id); return; }

  const fila = t.closest(".fila");
  if (fila) {
    const id = fila.dataset.id;
    if (abiertos.has(id)) abiertos.delete(id); else abiertos.add(id);
    render();
  }
});

inputBuscar.addEventListener("input", () => { busqueda = inputBuscar.value.trim() ? inputBuscar.value : ""; rutaPintada = null; render(); });

// "/" para buscar y Escape para salir, como en los buscadores de código
document.addEventListener("keydown", (e) => {
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !escribiendo && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); ponerPestana("partidos"); inputBuscar.focus(); inputBuscar.select();
  } else if (e.key === "Escape" && document.activeElement === inputBuscar) {
    limpiarBusqueda(); rutaPintada = null; render(); inputBuscar.blur();
  }
});

// Un escudo que no carga se queda en monograma, y se recuerda para no volver a pedirlo.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG" || !img.parentNode || !img.parentNode.classList.contains("escudo")) return;
  escudosRotos.add(img.getAttribute("src"));
  const s = img.parentNode;
  s.classList.add("mono");
  s.setAttribute("aria-hidden", "true");
  s.textContent = s.dataset.ini || "?";
}, true);

// Tooltip: uno solo, que sigue al foco o al ratón. Lo mismo está siempre en la tabla
// o en la etiqueta accesible: el tooltip ayuda, no esconde nada.
function mostrarTip(el) {
  const txt = el.getAttribute("data-tip");
  if (!txt) return;
  tip.textContent = txt;
  tip.hidden = false;
  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.left + r.width / 2 - w / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  let y = r.top - h - 8;
  if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function ocultarTip() { tip.hidden = true; }
document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (el) mostrarTip(el); else ocultarTip(); });
document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) mostrarTip(el); else ocultarTip(); });
document.addEventListener("scroll", ocultarTip, true);

window.addEventListener("hashchange", () => render());
mqEscritorio.addEventListener("change", () => { rutaPintada = null; render(); });

// ==========================================
// SONDEO
// ==========================================
let periodo = 4000;
let estadoPrevio = null;
async function refrescar() {
  try {
    datos = await (await fetch("/api/estado")).json();
    periodo = (datos.estado === "actualizando") ? 4000 : 30000;
    // las medias de liga solo cambian cuando termina una pasada
    if (estadoPrevio === "actualizando" && datos.estado !== "actualizando") cargarLigas();
    estadoPrevio = datos.estado;
    render();
  } catch (e) {
    estadoCorto.dataset.modo = "error";
    estadoCorto.querySelector(".txt").textContent = "Sin conexión";
    estadoBarra.dataset.modo = "error";
    estadoBarra.innerHTML = '<span><span class="punto"></span>Sin conexión con el servidor. Reintentando…</span>';
    estadoBarra.dataset.huella = "";
  }
}

async function cargarLigas() {
  try {
    infoLigas = await (await fetch("/api/ligas")).json();
    paneLigas.dataset.huella = "";
    if (datos) render();
  } catch (e) { /* sin medias: el panel enseña solo los recuentos */ }
}

// La validación es cara de calcular pero no cambia casi nunca: se pide al arrancar.
async function cargarValidacion() {
  try {
    validacion = await (await fetch("/api/validacion")).json();
    paneLigas.dataset.huella = "";
    if (datos) render();
  } catch (e) { /* sin fiabilidad medida: el panel lo dice */ }
}

async function bucle() { await refrescar(); setTimeout(bucle, periodo); }
bucle();
cargarLigas();
cargarValidacion();
