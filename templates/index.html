<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronósticos ⚽</title>
<style>
  :root {
    --fondo: #0f1115; --tarjeta: #1a1d24; --tarjeta-alta: #212630; --borde: #2b303b;
    --texto: #e8eaed; --tenue: #8b93a1; --muy-tenue: #5c6472;
    --local: #60a5fa; --empate: #a1a1aa; --visita: #f472b6; --doble: #4ade80;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px;
         margin: 0 auto; padding: 16px 16px 60px; background: var(--fondo); color: var(--texto); }

  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; min-height: 34px; }
  .top h1 { font-size: 1.3rem; margin: 0; }
  .volver { background: var(--tarjeta); border: 1px solid var(--borde); color: var(--texto);
            border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
            font-family: inherit; flex-shrink: 0; }
  .volver:hover { background: var(--tarjeta-alta); }

  #barra-estado { font-size: 0.82rem; color: var(--tenue); margin-bottom: 6px; }
  #progreso { height: 4px; background: var(--borde); border-radius: 2px;
              overflow: hidden; margin-bottom: 18px; }
  #progreso > span { display: block; height: 100%; background: var(--doble); width: 0;
                     transition: width 0.4s; }

  .buscador { width: 100%; background: var(--tarjeta); border: 1px solid var(--borde);
              color: var(--texto); border-radius: 10px; padding: 11px 13px; font-size: 0.95rem;
              font-family: inherit; margin-bottom: 20px; }
  .buscador::placeholder { color: var(--muy-tenue); }
  .buscador:focus { outline: none; border-color: var(--local); }

  .seccion { font-size: 0.75rem; color: var(--muy-tenue); text-transform: uppercase;
             letter-spacing: 0.07em; margin: 0 0 10px; }
  .seccion.siguiente { margin-top: 26px; }

  .liga-card { display: flex; align-items: center; justify-content: space-between; gap: 14px;
               width: 100%; text-align: left; background: var(--tarjeta);
               border: 1px solid var(--borde); border-radius: 12px; padding: 16px;
               cursor: pointer; color: inherit; font-family: inherit;
               transition: background 0.15s, border-color 0.15s; }
  .liga-card:hover { background: var(--tarjeta-alta); border-color: #3b4252; }
  .liga-card .nombre { font-size: 1.05rem; font-weight: 600; }
  .liga-card .meta { font-size: 0.78rem; color: var(--tenue); margin-top: 3px; }
  .liga-card .flecha { color: var(--muy-tenue); font-size: 1.3rem; }
  #ligas > div { margin-bottom: 10px; }

  .tira { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
          margin-bottom: 16px; scrollbar-width: thin; }
  .chip { flex-shrink: 0; background: var(--tarjeta); border: 1px solid var(--borde);
          color: var(--tenue); border-radius: 999px; padding: 7px 14px; font-size: 0.82rem;
          cursor: pointer; font-family: inherit; white-space: nowrap; }
  .chip:hover { background: var(--tarjeta-alta); }
  .chip.activo { background: var(--local); border-color: var(--local); color: #0f1115; font-weight: 600; }
  .chip .n { opacity: 0.65; margin-left: 5px; font-size: 0.75rem; }

  .orden { display: flex; gap: 6px; margin-bottom: 14px; }
  .orden .chip { font-size: 0.76rem; padding: 5px 11px; }
  .orden .chip.activo { background: var(--tarjeta-alta); border-color: #4b5563;
                        color: var(--texto); }

  .grupo-cab { font-size: 0.85rem; color: var(--muy-tenue); text-transform: uppercase;
               letter-spacing: 0.04em; padding-bottom: 6px; margin: 22px 0 10px;
               border-bottom: 1px solid var(--borde); }

  .partido { border: 1px solid var(--borde); border-radius: 10px; padding: 13px;
             margin-bottom: 10px; background: var(--tarjeta); }
  .partido.pendiente { opacity: 0.5; }
  .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .equipos { font-weight: 600; font-size: 1rem; }
  .hora { font-size: 0.8rem; color: var(--tenue); white-space: nowrap;
          font-variant-numeric: tabular-nums; }
  .contexto { color: var(--muy-tenue); font-size: 0.75rem; margin-top: 2px; }
  .xg { color: var(--tenue); font-size: 0.78rem; margin: 8px 0 2px;
        font-variant-numeric: tabular-nums; }
  .aviso { color: #fbbf24; font-size: 0.73rem; margin: 6px 0 2px; }
  .esperando { color: var(--muy-tenue); font-size: 0.8rem; margin-top: 8px; font-style: italic; }

  .fila { margin: 7px 0; font-size: 0.88rem; }
  .fila-cab { display: flex; justify-content: space-between; margin-bottom: 3px;
              font-variant-numeric: tabular-nums; }
  .barra { height: 6px; background: #262a33; border-radius: 3px; overflow: hidden; }
  .barra > span { display: block; height: 100%; transition: width 0.3s; }

  .dobles { display: flex; gap: 7px; margin-top: 12px; }
  .doble { flex: 1; background: #14261c; border: 1px solid #22543d; border-radius: 8px;
           padding: 6px 4px; text-align: center; }
  .doble b { display: block; color: var(--doble); font-size: 0.92rem;
             font-variant-numeric: tabular-nums; }
  .doble span { color: #6b8578; font-size: 0.68rem; }

  .vacio { color: var(--tenue); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <div class="top">
    <button class="volver" id="btn-volver" hidden>← Inicio</button>
    <h1 id="titulo">⚽ Pronósticos</h1>
  </div>
  <div id="barra-estado">Cargando…</div>
  <div id="progreso"><span></span></div>
  <div id="vista"></div>

<script>
const vista = document.getElementById("vista");
const titulo = document.getElementById("titulo");
const btnVolver = document.getElementById("btn-volver");
const barra = document.getElementById("barra-estado");
const progreso = document.querySelector("#progreso > span");

let datos = null;        // último /api/estado
let rutaPintada = null;  // para saber cuándo hay que reconstruir el DOM
let orden = "hora";      // criterio de ordenación
let busqueda = "";       // texto del buscador

// ==========================================
// UTILIDADES
// ==========================================
// Los nombres de equipo vienen de football-data.org, no de nosotros. Todo lo que
// llega de fuera se trata como texto, nunca como HTML.
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(v) { return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, c => ESCAPES[c]); }

// para buscar sin que estorben tildes ni mayúsculas
function normalizar(v) {
  return String(v || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// OJO: new Date("2026-09-06") se interpreta como medianoche UTC y en Lima cae el día
// anterior. Por eso la fecha se parte a mano.
function fechaCorta(iso) {
  const p = iso.split("-");
  return Number(p[2]) + "/" + Number(p[1]);
}

/** Todos los partidos en una lista plana, cada uno sabiendo a qué día pertenece. */
function aplanar(dias) {
  const out = [];
  (dias || []).forEach(d => d.partidos.forEach(p =>
    out.push(Object.assign({}, p, { fecha: d.fecha, dia: d.etiqueta }))));
  return out;
}

function porLigas(partidos) {
  const m = new Map();
  partidos.forEach(p => {
    const cod = p.liga_codigo || p.liga || "?";
    if (!m.has(cod)) m.set(cod, { codigo: cod, nombre: p.liga, partidos: [] });
    m.get(cod).partidos.push(p);
  });
  return [...m.values()];
}

function porDias(partidos) {
  const m = new Map();
  partidos.forEach(p => {
    if (!m.has(p.fecha)) m.set(p.fecha, { fecha: p.fecha, etiqueta: p.dia, partidos: [] });
    m.get(p.fecha).partidos.push(p);
  });
  return [...m.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
}

// ==========================================
// ORDENACIÓN
// ==========================================
// "Claro" = hay un resultado con probabilidad alta. "Reñido" = ninguno destaca, o sea
// que el máximo de las tres probabilidades es bajo. Un 34/33/33 es lo más reñido posible.
function favorito(p) { return Math.max(p.prob_local, p.prob_empate, p.prob_visita); }

const ORDENES = {
  hora:    { etiqueta: "Por hora",    fn: (a, b) => a.utcDate.localeCompare(b.utcDate) },
  claros:  { etiqueta: "Más claros",  fn: (a, b) => favorito(b) - favorito(a) },
  renidos: { etiqueta: "Más reñidos", fn: (a, b) => favorito(a) - favorito(b) },
};

function ordenar(lista) {
  if (orden === "hora") return [...lista].sort(ORDENES.hora.fn);
  // los que aún no tienen número no se pueden ordenar por probabilidad: van al final
  const con = lista.filter(p => !p.pendiente).sort(ORDENES[orden].fn);
  const sin = lista.filter(p => p.pendiente).sort(ORDENES.hora.fn);
  return [...con, ...sin];
}

// ==========================================
// TARJETA DE PARTIDO
// ==========================================
function filaProb(etiqueta, valor, color) {
  return '<div class="fila">'
    + '<div class="fila-cab"><span>' + etiqueta + '</span><span>' + valor.toFixed(1) + '%</span></div>'
    + '<div class="barra"><span style="width:' + valor + '%;background:' + color + '"></span></div>'
    + '</div>';
}

function htmlPartido(p, contexto) {
  const cabecera = '<div class="cab"><div>'
    + '<div class="equipos">' + esc(p.local) + ' vs ' + esc(p.visita) + '</div>'
    + (contexto ? '<div class="contexto">' + esc(contexto) + '</div>' : '')
    + '</div><div class="hora">' + esc(p.hora) + '</div></div>';

  if (p.pendiente) return cabecera + '<div class="esperando">Pendiente de calcular…</div>';

  // Con pocos partidos previos la predicción está dominada por la media de la liga.
  // Mejor decirlo que fingir una precisión que no existe.
  const ml = p.muestra_local === undefined ? 99 : p.muestra_local;
  const mv = p.muestra_visita === undefined ? 99 : p.muestra_visita;
  const muestra = Math.min(ml, mv);
  const aviso = muestra < 4
    ? '<div class="aviso">⚠ Pocos partidos previos (' + muestra
      + '); la estimación tira hacia la media de la liga.</div>'
    : '';

  return cabecera
    + '<div class="xg">xG estimado: ' + p.xg_local + ' - ' + p.xg_visita + '</div>'
    + aviso
    + filaProb("Victoria Local", p.prob_local, "var(--local)")
    + filaProb("Empate", p.prob_empate, "var(--empate)")
    + filaProb("Victoria Visita", p.prob_visita, "var(--visita)")
    + '<div class="dobles">'
    + '<div class="doble"><b>' + p.prob_1x + '%</b><span>1X</span></div>'
    + '<div class="doble"><b>' + p.prob_x2 + '%</b><span>X2</span></div>'
    + '<div class="doble"><b>' + p.prob_12 + '%</b><span>12</span></div>'
    + '</div>';
}

/**
 * Pinta bloques dentro de un contenedor tocando el DOM lo mínimo: cada bloque tiene
 * id y huella, y si la huella no cambió no se toca. Así no parpadea ni se pierde el
 * scroll cuando entra una tanda nueva de resultados.
 * `items` es [{id, huella, clase, html}].
 */
function pintarBloques(cont, items) {
  const vistos = new Set();
  items.forEach((it, i) => {
    vistos.add(it.id);
    let el = document.getElementById(it.id);
    if (!el) { el = document.createElement("div"); el.id = it.id; }
    if (el.dataset.huella !== it.huella) {
      el.dataset.huella = it.huella;
      el.className = it.clase;
      el.innerHTML = it.html;
    }
    if (cont.children[i] !== el) cont.insertBefore(el, cont.children[i] || null);
  });
  [...cont.children].forEach(el => { if (!vistos.has(el.id)) el.remove(); });
}

function bloquesDePartidos(partidos, contextoDe) {
  return partidos.map(p => {
    const ctx = contextoDe ? contextoDe(p) : "";
    return {
      id: "p-" + p.id,
      huella: JSON.stringify(p) + "|" + ctx,
      clase: "partido" + (p.pendiente ? " pendiente" : ""),
      html: htmlPartido(p, ctx),
    };
  });
}

function bloqueCabecera(clave, texto) {
  return { id: "cab-" + clave, huella: texto, clase: "grupo-cab", html: esc(texto) };
}

// ==========================================
// RUTA
//   #/                    inicio
//   #/liga/PD             una liga entera
//   #/liga/PD/2026-09-12  una liga, un día
//   #/dia/2026-09-12      un día, todas las ligas
// ==========================================
function leerRuta() {
  const partes = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean);
  if (partes[0] === "liga" && partes[1]) {
    return { vista: "liga", liga: decodeURIComponent(partes[1]), fecha: partes[2] || null };
  }
  if (partes[0] === "dia" && partes[1]) return { vista: "dia", fecha: partes[1] };
  return { vista: "inicio" };
}
function irA(hash) { location.hash = hash; }

// ==========================================
// CONTROLES REUTILIZABLES
// ==========================================
function tiraDeChips(cont, opciones, activo, alPulsar) {
  const html = opciones.map(o =>
    '<button class="chip ' + (o.valor === activo ? "activo" : "") + '" data-v="' + esc(o.valor) + '">'
    + esc(o.texto)
    + (o.n === undefined || o.n === null ? "" : '<span class="n">' + o.n + '</span>')
    + '</button>').join("");
  if (cont.dataset.huella === html) return;
  cont.dataset.huella = html;
  cont.innerHTML = html;
  cont.querySelectorAll(".chip").forEach(b => { b.onclick = () => alPulsar(b.dataset.v); });
}

function pintarOrden(cont) {
  tiraDeChips(cont,
    Object.keys(ORDENES).map(v => ({ valor: v, texto: ORDENES[v].etiqueta })),
    orden,
    v => { orden = v; rutaPintada = null; render(); });
}

// ==========================================
// VISTA: INICIO
// ==========================================
function pintarInicio(todos, reconstruir) {
  titulo.textContent = "⚽ Pronósticos";
  btnVolver.hidden = true;

  if (reconstruir) {
    vista.innerHTML =
      '<input class="buscador" id="buscador" type="search" autocomplete="off"'
      + ' placeholder="Buscar equipo…" value="' + esc(busqueda) + '">'
      + '<div id="resultados"></div>'
      + '<div id="secciones">'
      + '<p class="seccion">Por día</p><div class="tira" id="dias-tira"></div>'
      + '<p class="seccion siguiente">Ligas</p><div id="ligas"></div>'
      + '</div>';
    const input = document.getElementById("buscador");
    input.oninput = () => { busqueda = input.value; render(); };
  }

  const secciones = document.getElementById("secciones");
  const resultados = document.getElementById("resultados");

  // --- con búsqueda activa el inicio se convierte en una lista de resultados ---
  const q = normalizar(busqueda).trim();
  if (q) {
    secciones.hidden = true;
    resultados.hidden = false;
    const hallados = ordenar(todos.filter(p =>
      normalizar(p.local).indexOf(q) >= 0 || normalizar(p.visita).indexOf(q) >= 0));
    if (!hallados.length) {
      resultados.innerHTML = '<div class="vacio">Ningún partido de "' + esc(busqueda)
        + '" en los próximos días.</div>';
      return;
    }
    if (!resultados.querySelector(".orden")) {
      resultados.innerHTML = '<div class="orden" id="orden-b"></div><div id="lista-b"></div>';
    }
    pintarOrden(document.getElementById("orden-b"));
    pintarBloques(document.getElementById("lista-b"),
      bloquesDePartidos(hallados, p => p.dia + " " + fechaCorta(p.fecha) + " · " + p.liga));
    return;
  }

  secciones.hidden = false;
  resultados.hidden = true;
  resultados.innerHTML = "";

  // --- chips de día, cruzando todas las ligas ---
  const dias = porDias(todos);
  tiraDeChips(document.getElementById("dias-tira"),
    dias.map(d => ({ valor: d.fecha, texto: d.etiqueta + " " + fechaCorta(d.fecha),
                     n: d.partidos.length })),
    null,
    f => irA("#/dia/" + f));

  // --- tarjetas de liga ---
  pintarBloques(document.getElementById("ligas"), porLigas(todos).map(L => {
    const listos = L.partidos.filter(p => !p.pendiente).length;
    const ds = porDias(L.partidos);
    const rango = ds.length === 1 ? ds[0].etiqueta
      : ds[0].etiqueta + " — " + fechaCorta(ds[ds.length - 1].fecha);
    const meta = L.partidos.length + " partido" + (L.partidos.length === 1 ? "" : "s")
      + " · " + rango
      + (listos < L.partidos.length ? " · " + (L.partidos.length - listos) + " sin calcular" : "");
    return {
      id: "L-" + L.codigo,
      huella: L.nombre + "|" + meta,
      clase: "",
      html: '<button class="liga-card" data-liga="' + esc(L.codigo) + '">'
        + '<div><div class="nombre">' + esc(L.nombre) + '</div>'
        + '<div class="meta">' + esc(meta) + '</div></div>'
        + '<div class="flecha">›</div></button>',
    };
  }));
  vista.querySelectorAll(".liga-card").forEach(b => {
    b.onclick = () => irA("#/liga/" + encodeURIComponent(b.dataset.liga));
  });
}

// ==========================================
// VISTA: UNA LIGA
// ==========================================
function pintarLiga(todos, codigo, fechaSel, reconstruir) {
  const suyos = todos.filter(p => (p.liga_codigo || p.liga) === codigo);
  if (!suyos.length) { irA("#/"); return; }

  titulo.textContent = suyos[0].liga;
  btnVolver.hidden = false;
  btnVolver.textContent = fechaSel ? "← Todas las fechas" : "← Inicio";

  if (reconstruir) {
    vista.innerHTML = '<div class="tira" id="fechas"></div>'
      + '<div class="orden" id="orden"></div><div id="lista"></div>';
  }

  const dias = porDias(suyos);
  tiraDeChips(document.getElementById("fechas"),
    [{ valor: "", texto: "Todas", n: suyos.length }].concat(
      dias.map(d => ({ valor: d.fecha, texto: d.etiqueta + " " + fechaCorta(d.fecha),
                       n: d.partidos.length }))),
    fechaSel || "",
    f => irA("#/liga/" + encodeURIComponent(codigo) + (f ? "/" + f : "")));

  pintarOrden(document.getElementById("orden"));

  const sel = fechaSel ? suyos.filter(p => p.fecha === fechaSel) : suyos;
  const lista = document.getElementById("lista");
  if (!sel.length) { lista.innerHTML = '<div class="vacio">No hay partidos en esa fecha.</div>'; return; }

  // Ordenar por probabilidad implica una lista única en ranking: agrupar por día
  // rompería precisamente el orden que se acaba de pedir.
  if (orden !== "hora" || fechaSel) {
    const ctx = fechaSel ? null : (p => p.dia + " " + fechaCorta(p.fecha));
    pintarBloques(lista, bloquesDePartidos(ordenar(sel), ctx));
    return;
  }
  const bloques = [];
  porDias(sel).forEach(d => {
    bloques.push(bloqueCabecera(d.fecha, d.etiqueta + " · " + fechaCorta(d.fecha)));
    bloques.push.apply(bloques, bloquesDePartidos(ordenar(d.partidos), null));
  });
  pintarBloques(lista, bloques);
}

// ==========================================
// VISTA: UN DÍA, TODAS LAS LIGAS
// ==========================================
function pintarDia(todos, fecha, reconstruir) {
  const delDia = todos.filter(p => p.fecha === fecha);
  if (!delDia.length) { irA("#/"); return; }

  titulo.textContent = delDia[0].dia + " " + fechaCorta(fecha);
  btnVolver.hidden = false;
  btnVolver.textContent = "← Inicio";

  if (reconstruir) {
    vista.innerHTML = '<div class="tira" id="fechas"></div>'
      + '<div class="orden" id="orden"></div><div id="lista"></div>';
  }

  tiraDeChips(document.getElementById("fechas"),
    porDias(todos).map(d => ({ valor: d.fecha, texto: d.etiqueta + " " + fechaCorta(d.fecha),
                               n: d.partidos.length })),
    fecha,
    f => irA("#/dia/" + f));

  pintarOrden(document.getElementById("orden"));
  const lista = document.getElementById("lista");

  if (orden !== "hora") {
    pintarBloques(lista, bloquesDePartidos(ordenar(delDia), p => p.liga));
    return;
  }
  const bloques = [];
  porLigas(delDia).forEach(L => {
    bloques.push(bloqueCabecera(L.codigo, L.nombre));
    bloques.push.apply(bloques, bloquesDePartidos(ordenar(L.partidos), null));
  });
  pintarBloques(lista, bloques);
}

// ==========================================
// RENDER
// ==========================================
const TEXTO_ESTADO = {
  actualizando: "Calculando…",
  parcial: "Pausado por el límite de la API. Sigue en la próxima actualización.",
  listo: "Al día.",
  error: "Error en la última actualización",
};

function render() {
  if (!datos) return;

  if (datos.estado === "sin_datos") {
    barra.textContent = "Todavía no hay datos. Esperando la primera actualización…";
    return;
  }

  const hechos = (datos.total || 0) - (datos.pendientes || 0);
  const texto = datos.estado === "error"
    ? TEXTO_ESTADO.error + ": " + (datos.error || "desconocido")
    : (TEXTO_ESTADO[datos.estado] || datos.estado);
  barra.textContent = datos.estado === "sin_partidos"
    ? "Sin partidos. Última revisión: " + new Date(datos.ultima_actualizacion).toLocaleString()
    : texto + " " + hechos + "/" + datos.total + " calculados · "
      + new Date(datos.ultima_actualizacion).toLocaleTimeString();
  progreso.style.width = datos.total ? (100 * hechos / datos.total) + "%" : "0";

  if (datos.estado === "sin_partidos") {
    vista.innerHTML = '<div class="vacio">No hay partidos programados en los próximos días.</div>';
    return;
  }

  const todos = aplanar(datos.dias);
  const ruta = leerRuta();
  const clave = JSON.stringify(ruta) + "|" + orden + "|" + (busqueda ? "b" : "");
  const reconstruir = clave !== rutaPintada;
  rutaPintada = clave;

  if (ruta.vista === "liga") pintarLiga(todos, ruta.liga, ruta.fecha, reconstruir);
  else if (ruta.vista === "dia") pintarDia(todos, ruta.fecha, reconstruir);
  else pintarInicio(todos, reconstruir && !busqueda);
}

// El botón sube un nivel de la ruta en vez de usar history.back(): history.length no es
// fiable, y si alguien abre un enlace directo el atrás lo sacaría de la página. El atrás
// del navegador sigue funcionando por su cuenta gracias al hash.
btnVolver.onclick = () => {
  const r = leerRuta();
  if (r.vista === "liga" && r.fecha) irA("#/liga/" + encodeURIComponent(r.liga));
  else irA("#/");
};
window.addEventListener("hashchange", () => { busqueda = ""; rutaPintada = null; render(); });

// ==========================================
// SONDEO
// ==========================================
let periodo = 4000;
async function refrescar() {
  try {
    datos = await (await fetch("/api/estado")).json();
    periodo = (datos.estado === "actualizando") ? 4000 : 30000;
    render();
  } catch (e) {
    barra.textContent = "Sin conexión con el servidor.";
  }
}
async function bucle() { await refrescar(); setTimeout(bucle, periodo); }
bucle();
</script>
