<style>
  /* ================================================================
     MARCADOR DE ESTADIO DE NOCHE
     La banda de arriba es el marcador: los próximos partidos en grande,
     con su casilla dorada. Debajo, tableros redondeados sobre la noche.
     Es lo único llamativo; el resto, sobrio.

     Tipografía: Saira (letra de marcador, cuadrada y redondeada) para la
     marca, los títulos y TODOS los números; Figtree para nombres y textos.
     Las dos con cifras tabulares, comprobadas.

     Color con trabajo asignado, nunca decorativo:
       - oro = probabilidad. Escala secuencial de 8 tramos de un solo tono
         ámbar, validada con el script de dataviz (luminosidad monótona,
         saltos >= 0.06, el tramo más bajo >= 2:1 sobre el tablero). En las
         celdas, tinta blanca en los 3 primeros tramos y oscura en el resto,
         todas >= 4.8:1. Nada más usa ese tono.
       - 8 tonos de liga, validados para pares adyacentes en orden fijo
         (LaLiga, Premier, Ligue 1, Bundesliga, Serie A, Eredivisie,
         Primeira Liga, Championship). Van siempre en una insignia CON la
         sigla dentro (ESP, ENG...): la sigla identifica la liga y el color
         acompaña, así que pueden ir mezcladas. La novena liga (Brasileirão)
         no tiene tono: la paleta validada tiene 8 y un noveno color
         inventado no pasaría la prueba. Va en gris rayado.
       - blanco = lo seleccionado (día, liga, orden).
       - estado (error) con icono y texto, nunca color solo.

     Redondeo con jerarquía, no uno para todo: tableros 20, tarjetas 14,
     controles 10, celdas 8, píldoras redondas.
     ================================================================ */
  :root {
    --fondo: #070d0a;
    --banda: #0b130f;
    --panel: #111a15;
    --panel-alto: #18241e;
    --panel-hondo: #0c130f;
    --linea: #1f2b25;
    --linea-viva: #2d3d35;

    --tinta: #f4f7f5;
    --tinta-2: #b8c5bd;
    --tinta-3: #87968c;
    --oscura: #0a120e;

    --oro: #ffd24c;        /* tramo alto de la escala de probabilidad */
    --oro-medio: #a18047;  /* tramo 50-60: barras que no son la más alta */

    /* paleta de liga: validada con el script de dataviz, orden adyacente */
    --liga-PD: #e66767;
    --liga-PL: #9085e9;
    --liga-FL1: #199e70;
    --liga-BL1: #d95926;
    --liga-SA: #3987e5;
    --liga-DED: #c98500;
    --liga-PPL: #d55181;
    --liga-ELC: #008300;
    --liga-BSA: repeating-linear-gradient(135deg, #a7b3ab 0 4px, #8a978f 4px 8px);

    --critico: #e5484d;

    --f-disp: "Saira", "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
    --f-txt: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;

    --t-12: 0.75rem;
    --t-13: 0.8125rem;
    --t-14: 0.875rem;
    --t-15: 0.9375rem;
    --t-16: 1rem;
    --t-18: 1.125rem;
    --t-20: 1.25rem;
    --t-24: 1.5rem;
    --t-28: 1.75rem;

    --r-tablero: 20px;
    --r-tarjeta: 14px;
    --r-control: 10px;
    --r-celda: 8px;

    --hueco: 12px;
    --ancho-izq: 19rem;
    --ancho-der: clamp(20rem, 23vw, 28rem);
    --col-liga: 3rem;
    --col-hora: 4rem;      /* la hora, en la tabla (panel central de 640px o más) */
    --col-hora-c: 3.25rem; /* y en la lista compacta */
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  /* en monitores de 27" a 2560 px todo crece un poco: las medidas están en rem */
  @media (min-width: 2200px) { html { font-size: 112.5%; } }

  body {
    margin: 0;
    font-family: var(--f-txt);
    font-size: var(--t-15);
    line-height: 1.45;
    background: var(--fondo);
    color: var(--tinta);
  }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  .salto { position: absolute; left: -9999px; z-index: 20; background: var(--tinta); color: var(--oscura);
           padding: 10px 16px; font-weight: 700; border-radius: var(--r-control); }
  .salto:focus { left: 12px; top: 10px; }

  .num { font-variant-numeric: tabular-nums; }
  .disp { font-family: var(--f-disp); font-stretch: 88%; }

  /* insignia de liga: la sigla dentro de su color. Tinta oscura o blanca según
     el tono, todas >= 4.8:1 */
  .insignia {
    display: inline-grid; place-items: center; flex-shrink: 0;
    min-width: 2.25rem; height: 1.375rem; padding: 0 6px; border-radius: 6px;
    background: var(--tono, var(--tinta-3)); color: var(--tono-t, var(--oscura));
    font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-12); font-weight: 800;
    letter-spacing: 0.03em; line-height: 1;
  }
  .insignia.grande { width: 2.75rem; height: 2.75rem; border-radius: var(--r-control); font-size: var(--t-14); }
  .insignia.redonda { min-width: 0; width: 2rem; height: 2rem; padding: 0; border-radius: 50%; font-size: 0.6875rem; }
  .insignia.todas { background: var(--panel-hondo); color: var(--tinta-2); box-shadow: inset 0 0 0 1px var(--linea-viva); }
  /* la Champions: torneo, insignia de contorno en la tinta del texto */
  .insignia.copa { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
  .tira-ligas button[aria-current="true"] .insignia.copa { color: var(--oscura); }
  /* liga de fiabilidad baja (Championship, Brasileirão): aviso discreto, con icono y texto */
  .poco-fiable { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; padding: 2px 8px;
                 border: 1px solid var(--linea-viva); border-radius: 999px; font-family: var(--f-txt); font-size: var(--t-12);
                 font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--tinta-2); white-space: nowrap; cursor: help; }
  .poco-fiable svg { width: 12px; height: 12px; }
  /* con la tabla estrecha, en la cabecera del grupo solo el icono: el nombre de la liga no cabría */
  @container centro (max-width: 639px) {
    .grupo .poco-fiable { margin-left: -4px; padding: 4px 2px; border: 0; color: var(--tinta-2); }
    .grupo .poco-fiable svg { width: 14px; height: 14px; }
    .grupo .poco-fiable span { display: none; }
  }
  /* Mis equipos: la estrella en blanco sobre el fondo del tablero (el oro es la probabilidad) */
  .insignia.fav { background: var(--panel-hondo); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--linea-viva); }
  .insignia.fav svg { width: 55%; height: 55%; max-width: 18px; max-height: 18px; }
  .sigo { display: inline-flex; flex-shrink: 0; color: var(--tinta-2); }
  .sigo svg { width: 12px; height: 12px; }

  /* ================================================================
     ESQUELETO
     Escritorio: aplicación de altura fija; cada tablero con su propio
     desplazamiento. Móvil: documento normal y pestañas abajo, que en el
     teléfono se desplaza mejor la página que un panel.
     ================================================================ */
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "cab" "centro";
    min-height: 100dvh;
  }
  .cab { grid-area: cab; }
  .centro { grid-area: centro; min-width: 0; --sup: var(--fondo); }
  .lateral { display: none; }
  .pane-izq, .pane-der { min-width: 0; }
  .estado-barra { display: none; }

  @media (min-width: 880px) {
    .app {
      height: 100dvh;
      grid-template-columns: minmax(0, 1fr) var(--ancho-der);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "cab cab" "centro lat" "estado estado";
      column-gap: var(--hueco);
      padding: 0 var(--hueco);
    }
    .cab { margin: 0 calc(-1 * var(--hueco)) var(--hueco); }
    .centro { display: flex; flex-direction: column; min-height: 0; --sup: var(--panel);
              background: var(--panel); border-radius: var(--r-tablero); overflow: hidden; }
    .lateral { display: flex; flex-direction: column; grid-area: lat; overflow-y: auto; min-height: 0; scrollbar-width: thin;
               background: var(--panel); border-radius: var(--r-tablero); }
    .pane-izq, .pane-der { display: contents; }
    .m-ligas { order: 1; } .m-claros { order: 2; } .m-confianza { order: 3; } .m-fiab { order: 4; } .m-resultados { order: 5; }
    .estado-barra { display: flex; grid-area: estado; }
    .pestanas { display: none !important; }
  }
  @media (min-width: 1180px) {
    .app {
      grid-template-columns: var(--ancho-izq) minmax(0, 1fr) var(--ancho-der);
      grid-template-areas: "cab cab cab" "izq centro der" "estado estado estado";
    }
    /* el envoltorio desaparece y cada panel ocupa su propia columna */
    .lateral { display: contents; }
    .pane-izq, .pane-der { display: block; overflow-y: auto; min-height: 0; scrollbar-width: thin;
                           background: var(--panel); border-radius: var(--r-tablero); }
    .pane-izq { grid-area: izq; }
    .pane-der { grid-area: der; }
  }

  /* ---------------- banda del marcador ---------------- */
  .cab {
    display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
    padding: 14px 16px 16px; background: var(--banda); border-bottom: 1px solid var(--linea);
  }
  @media (min-width: 880px) {
    .cab { flex-wrap: nowrap; gap: 22px; min-height: 6rem; padding: 10px var(--hueco) 10px 22px; }
  }

  .marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--tinta); flex-shrink: 0; }
  .marca svg { display: block; width: 34px; height: 34px; }
  .marca .nombre { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-24); font-weight: 800; letter-spacing: -0.02em; }
  @media (min-width: 880px) {
    .marca svg { width: 42px; height: 42px; }
    .marca .nombre { font-size: 1.875rem; }
  }

  .buscar {
    order: 3; flex: 1 1 100%;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--linea-viva); border-radius: 999px;
    padding: 0 14px 0 18px; height: 3rem; color: var(--tinta-3);
  }
  .buscar:focus-within { border-color: var(--tinta-2); background: var(--panel-alto); }
  .buscar input {
    flex: 1; min-width: 0; background: none; border: 0; color: var(--tinta);
    font: inherit; font-size: var(--t-16); outline: none; height: 100%;
  }
  .buscar input::placeholder { color: var(--tinta-3); }
  .buscar input::-webkit-search-cancel-button { filter: invert(0.6); }
  kbd {
    font-family: var(--f-disp); font-size: var(--t-13); font-weight: 700; color: var(--tinta-2);
    border: 1px solid var(--linea-viva); border-radius: 6px; padding: 1px 7px; line-height: 18px;
  }
  .buscar kbd { display: none; }
  @media (min-width: 880px) {
    .buscar { order: 0; flex: 0 1 20rem; }
    .buscar kbd { display: inline-block; }
  }

  /* próximos: tarjetas de marcador con su cuenta atrás y la casilla del favorito */
  .proximos {
    order: 4; flex: 1 1 100%; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    overflow-x: auto; scrollbar-width: none;
    margin: 2px -16px 0; padding: 0 16px;
  }
  .proximos::-webkit-scrollbar { display: none; }
  .proximos:empty { display: none; }
  @media (min-width: 880px) {
    .proximos {
      order: 0; flex: 1 1 auto; margin: 0; padding: 0;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent);
    }
  }
  .rotulo-cinta { display: none; }
  @media (min-width: 880px) { .rotulo-cinta { display: block; } }
  .rotulo-cinta {
    flex-shrink: 0; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-18); font-weight: 700;
    color: var(--tinta-3); padding-right: 2px;
  }
  .prox {
    flex: 0 0 auto; width: 15.5rem;
    display: grid; grid-template-columns: minmax(0, 1fr) 3.5rem; grid-template-rows: auto auto auto; gap: 3px 12px;
    align-items: center; text-align: left; cursor: pointer;
    padding: 9px 9px 9px 14px; border: 1px solid var(--linea); border-radius: var(--r-tarjeta); background: var(--panel);
  }
  .prox:hover { background: var(--panel-alto); border-color: var(--linea-viva); }
  .prox .p-cab { grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
                 font-size: var(--t-13); color: var(--tinta-2); white-space: nowrap; }
  .prox .p-cab .insignia { height: 1.25rem; min-width: 2rem; font-size: 0.6875rem; }
  .prox .p-eq { grid-column: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
                font-size: var(--t-15); font-weight: 600; line-height: 1.25; }
  .prox .p-eq .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prox .escudo, .prox .escudo img { width: 18px; height: 18px; }
  .prox .p-fav {
    grid-column: 2; grid-row: 1 / 4; align-self: stretch;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--r-control); background: var(--bg); color: var(--fg); line-height: 1;
  }
  .prox .p-fav .s { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-12); font-weight: 700; letter-spacing: 0.03em; }
  .prox .p-fav .v { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800; }
  .prox .p-fav.nada { background: var(--panel-alto); color: var(--tinta-3); font-size: var(--t-20); }

  /* "Instalar app": solo sale cuando el navegador lo ofrece (beforeinstallprompt) */
  .instalar {
    order: 2; margin-left: auto; display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border: 1px solid var(--linea-viva); border-radius: 999px; background: var(--panel-alto);
    font: inherit; font-size: var(--t-13); font-weight: 600; color: var(--tinta); cursor: pointer; white-space: nowrap;
  }
  .instalar:hover { border-color: var(--tinta-2); }
  .instalar:not([hidden]) + .estado-corto { margin-left: 0; }
  .instalar .largo { display: none; }   /* en el móvil no cabe con la marca y el estado */
  @media (max-width: 379px) {   /* en los más estrechos, con el botón, el estado se queda en su punto */
    .instalar:not([hidden]) + .estado-corto { padding: 9px; }
    .instalar:not([hidden]) + .estado-corto .txt { display: none; }
  }
  @media (min-width: 880px) {
    .instalar { order: 0; margin-left: 0; padding: 8px 14px; }
    .instalar .corto { display: none; }
    .instalar .largo { display: inline; }
  }
  /* la cuenta (básica, app.js sección CUENTA): solo en Cloudflare. En el móvil, un
     icono detrás del estado; en el escritorio, al final de la cabecera. */
  .boton-cuenta {
    order: 2; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 7px;
    min-width: 2.25rem; height: 2.25rem; padding: 0 8px; border: 1px solid var(--linea-viva); border-radius: 999px;
    background: var(--panel-alto); color: var(--tinta); font: inherit; font-size: var(--t-13); font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .boton-cuenta:hover { border-color: var(--tinta-2); }
  .boton-cuenta .txt { display: none; }
  .boton-cuenta[data-con] svg circle { fill: currentColor; }   /* con la sesión abierta, la cabeza rellena */
  @media (max-width: 379px) {
    .cab:has(.boton-cuenta:not([hidden])) .estado-corto { padding: 9px; }
    .cab:has(.boton-cuenta:not([hidden])) .estado-corto .txt { display: none; }
  }
  @media (min-width: 880px) {
    .boton-cuenta { order: 5; height: 2.5rem; padding: 0 14px; }
    .boton-cuenta .txt { display: inline; }
  }
  .estado-corto {
    order: 2; margin-left: auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border: 1px solid var(--linea-viva); border-radius: 999px;
    font-size: var(--t-13); font-weight: 600; color: var(--tinta-2);
  }
  @media (min-width: 880px) { .estado-corto { display: none; } }

  .punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--tinta-3); }
  [data-modo="trabajando"] .punto { background: var(--tinta); animation: latido 1.6s ease-in-out infinite; }
  [data-modo="pausa"] .punto { background: none; box-shadow: inset 0 0 0 1.5px var(--tinta-2); }
  [data-modo="reposo"] .punto { background: var(--tinta-3); }
  [data-modo="error"] .punto { background: var(--critico); }
  @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ---------------- centro ---------------- */
  .centro { container-type: inline-size; container-name: centro; }

  /* el único calendario: un día por tarjeta, con cuántos partidos tiene y, con
     una barrita por partido, cómo de claros son */
  .carril { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 16px 6px; }
  .carril::-webkit-scrollbar { display: none; }
  /* con ratón, una barra fina: si no caben todos los días (o los próximos), se ve que hay más */
  @media (hover: hover) and (pointer: fine) {
    .carril, .proximos { scrollbar-width: thin; scrollbar-color: var(--linea-viva) transparent; }
    .carril::-webkit-scrollbar, .proximos::-webkit-scrollbar { display: block; height: 6px; }
    .carril::-webkit-scrollbar-thumb, .proximos::-webkit-scrollbar-thumb { background: var(--linea-viva); border-radius: 3px; }
  }
  .dia-celda {
    flex: 0 0 auto; width: 6.5rem;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto;
    align-items: center; gap: 2px 8px; text-align: left; min-width: 0; overflow: hidden;
    padding: 10px 12px 10px; border: 1px solid var(--linea); border-radius: var(--r-tarjeta);
    background: var(--panel-alto); cursor: pointer; color: var(--tinta-2);
  }
  .dia-celda:hover { border-color: var(--linea-viva); color: var(--tinta); }
  .dia-celda[aria-current="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--oscura); }
  .dia-celda .dow { grid-column: 1; grid-row: 1; font-size: var(--t-13); font-weight: 600;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dia-celda .cuantos { grid-column: 2; grid-row: 1; justify-self: end;
                        font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-15); font-weight: 700; }
  .dia-celda .fecha { grid-column: 1 / -1; grid-row: 2; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28);
                      font-weight: 800; line-height: 1.05; letter-spacing: -0.01em; color: var(--tinta); white-space: nowrap; }
  .dia-celda[aria-current="true"] .fecha { color: var(--oscura); }
  .dia-celda .fecha small { font-family: var(--f-txt); font-size: var(--t-13); font-weight: 600; margin-left: 4px; letter-spacing: 0; opacity: 0.75; }
  .dia-celda .forma { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: flex-end; gap: 1px;
                      height: 16px; min-width: 0; overflow: hidden; margin-top: 4px; }
  .dia-celda .forma i { display: block; flex: 0 0 3px; border-radius: 1.5px 1.5px 0 0; }
  .dia-celda.toda { width: 7.25rem; }
  .dia-celda.tabla-celda .fecha { display: flex; align-items: center; height: 1.05em; color: inherit; }
  .dia-celda.tabla-celda .que { grid-column: 1 / -1; grid-row: 3; margin-top: 4px; font-size: var(--t-12); white-space: nowrap; }

  /* La tabla de una liga y su proyección (#/liga/PD/tabla) */
  .centro.en-tabla .cab-tabla, .centro.en-tabla #orden { display: none; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tabla-vista { padding: 4px 0 24px; }
  .tabla-sim { margin: 0 0 10px; font-size: var(--t-13); color: var(--tinta-3); }
  .tabla-desliza { overflow-x: auto; border-radius: var(--r-celda); }
  .tabla-desliza:focus-visible { outline: 2px solid var(--tinta-2); outline-offset: 2px; }
  .tabla-liga { width: 100%; border-collapse: collapse; font-size: var(--t-14); font-variant-numeric: tabular-nums; }
  .tabla-liga th, .tabla-liga td { padding: 6px 6px; border-bottom: 1px solid var(--linea); text-align: left; white-space: nowrap; }
  .tabla-liga thead th { font-size: var(--t-12); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-3);
                         border-bottom-color: var(--linea-viva); }
  .tabla-liga abbr { text-decoration: none; cursor: help; }
  .tabla-liga .corto { display: none; }
  .tabla-liga .n { text-align: right; }
  .tabla-liga .pos { width: 2rem; color: var(--tinta-3); }
  .tabla-liga th.eq { font-weight: 600; color: var(--tinta); max-width: 14rem; }
  .tabla-liga .eq-in { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tabla-liga .eq-in .nom { overflow: hidden; text-overflow: ellipsis; }
  .tabla-liga tr.raya td, .tabla-liga tr.raya th { border-bottom: 2px solid var(--tinta-3); }
  .tabla-liga .proy { color: var(--tinta-2); }
  .tabla-liga .tz { text-align: right; width: 3.6rem; }
  .tabla-liga .tz .v { display: inline-block; min-width: 2.6rem; padding: 3px 6px; border-radius: var(--r-celda); text-align: center;
                       background: var(--bg); color: var(--fg); font-family: var(--f-disp); font-stretch: 88%; font-weight: 700; }
  .tabla-liga .tz .nada { display: inline-block; min-width: 2.6rem; text-align: center; color: var(--tinta-3); }
  .tabla-nota { margin: 14px 0 0; max-width: 75ch; font-size: var(--t-13); line-height: 1.5; color: var(--tinta-3); }
  @container centro (max-width: 639px) {
    .tabla-liga .c-pj, .tabla-liga .c-dg { display: none; }
    .tabla-liga th, .tabla-liga td { padding: 6px 4px; }
    .tabla-liga th.eq { max-width: 7.5rem; }
    .tabla-liga thead th { letter-spacing: 0; font-size: 0.6875rem; }
    .tabla-liga .largo { display: none; }
    .tabla-liga .corto { display: inline; }
    .tabla-liga .pos { width: 1.4rem; }
    .tabla-liga .eq-in { gap: 6px; }
    .tabla-liga .tz { width: auto; }
    .tabla-liga .tz .v, .tabla-liga .tz .nada { min-width: 2rem; padding: 3px 3px; }
  }
  @container centro (min-width: 720px) {
    /* padding y hueco justos para que "Mañana" y su recuento quepan en los 5.75rem */
    .dia-celda { flex: 1 1 0; width: auto; min-width: 5.75rem; max-width: 10rem; padding-inline: 10px; column-gap: 4px; }
    .dia-celda.toda { flex-grow: 1.1; min-width: 6.75rem; max-width: 11rem; }
  }

  .herramientas {
    display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
    padding: 12px 16px 14px;
  }
  .titulo-vista { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800;
                  margin: 0; letter-spacing: -0.015em; line-height: 1.1; }
  .titulo-vista small { font-family: var(--f-txt); font-size: var(--t-15); font-weight: 500; color: var(--tinta-3);
                        margin-left: 10px; letter-spacing: 0; }
  @media (max-width: 879px) {
    .titulo-vista { flex: 1 1 100%; font-size: var(--t-24); min-width: 0; }
    .titulo-vista small { font-size: var(--t-14); }
    .herramientas .segmentos { margin-left: 0; }
  }

  .segmentos {
    display: flex; gap: 2px; margin-left: auto; padding: 3px;
    background: var(--panel-hondo); border: 1px solid var(--linea); border-radius: 999px;
  }
  .segmentos button {
    border: 0; background: none; cursor: pointer; padding: 7px 15px; border-radius: 999px;
    font-size: var(--t-14); font-weight: 600; color: var(--tinta-3); white-space: nowrap;
  }
  .segmentos button:hover { color: var(--tinta); }
  .segmentos button[aria-pressed="true"] { background: var(--tinta); color: var(--oscura); }
  @media (max-width: 879px) { .segmentos button { padding: 7px 12px; } }

  .segmentos:empty { display: none; }
  .app.sin-datos .cab-tabla, .app.sin-datos .carril { display: none; }
  .app.sin-datos .buscar { visibility: hidden; }

  #limpiar-hueco:empty { display: none; }
  .limpiar { border: 1px solid var(--linea-viva); border-radius: 999px; background: none; cursor: pointer;
             padding: 7px 14px; font-size: var(--t-14); font-weight: 600; color: var(--tinta-2); }
  .limpiar:hover { color: var(--tinta); border-color: var(--tinta-3); }

  /* ligas en píldoras: solo en móvil, donde no hay tablero lateral */
  .tira-ligas { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px 4px; }
  .tira-ligas::-webkit-scrollbar { display: none; }
  @media (min-width: 880px) { .tira-ligas { display: none; } }
  .tira-ligas button {
    flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
    height: 2.75rem; padding: 0 16px 0 6px; border: 1px solid var(--linea-viva); border-radius: 999px;
    background: var(--panel-alto); cursor: pointer; font-size: var(--t-15); font-weight: 600; color: var(--tinta);
    white-space: nowrap;
  }
  .tira-ligas button.sin-insignia { padding-left: 16px; }
  .tira-ligas button[aria-current="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--oscura); }
  .tira-ligas .n { font-family: var(--f-disp); font-stretch: 88%; font-weight: 700; opacity: 0.7; }

  .centro:not(.mezcla) { --col-liga: 0px; }
  .centro:not(.mezcla) .c-liga { visibility: hidden; }
  /* vistas con varios días en una lista (por claros, una liga entera, búsqueda): el día
     va debajo de la hora y la columna se ensancha para que "Mié 28 oct" no pise el escudo */
  .centro.con-dia { --col-hora: 4.75rem; --col-hora-c: 4rem; }

  .banda {
    display: flex; gap: 10px; align-items: flex-start; margin: 8px 16px 4px; padding: 12px 14px;
    border-radius: var(--r-tarjeta); background: var(--panel-alto);
    font-size: var(--t-14); color: var(--tinta-2);
  }
  .banda b { color: var(--tinta); font-weight: 700; }
  .banda svg { flex-shrink: 0; margin-top: 3px; }
  .banda.error svg { color: var(--critico); }
  @media (min-width: 880px) { .banda { display: none; } }

  /* ---------------- tabla ---------------- */
  .vista { min-height: 0; }
  @media (min-width: 880px) { .vista { flex: 1; overflow-y: auto; scrollbar-width: thin; } }

  .cab-tabla { display: none; }

  .grupo {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; background: var(--sup);
    border-bottom: 1px solid var(--linea);
    font-size: var(--t-16); font-weight: 700; color: var(--tinta);
  }
  .grupo .g-nom { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .grupo .g-nom .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grupo .cuenta { font-size: var(--t-14); font-weight: 500; color: var(--tinta-3); white-space: nowrap; }
  .grupo.dia .g-nom .txt { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-20); font-weight: 800; letter-spacing: -0.01em; }
  /* en compacto la cabecera usa la rejilla de la fila para rotular 1 X 2 encima de las celdas */
  @container centro (max-width: 639px) {
    .grupo { display: grid; grid-template-columns: var(--col-hora-c) minmax(0, 1fr) 2.875rem 2.875rem 2.875rem; gap: 0 4px; }
    .grupo .g-nom { grid-column: 1 / 3; }
    .grupo .cuenta { display: none; }
    .grupo .g-col { text-align: center; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-14); font-weight: 700; color: var(--tinta-3); }
  }
  @container centro (min-width: 640px) {
    .grupo .g-nom { flex: 1; }
    .grupo .g-col { display: none; }
  }

  .partido { border-bottom: 1px solid var(--linea); }

  /* ---- fila compacta (por defecto: el panel central es estrecho) ---- */
  /* la tira 1 X 2 a la derecha y centrada entre los dos equipos: dos líneas por
     partido en vez de tres */
  .fila {
    display: grid; width: 100%; text-align: left; cursor: pointer;
    grid-template-columns: var(--col-hora-c) minmax(0, 1fr) 2.875rem 2.875rem 2.875rem;
    grid-template-areas:
      "hora local  p1 px p2"
      "liga visita p1 px p2";
    gap: 5px 4px; align-items: center;
    padding: 12px 16px; border: 0; background: none;
  }
  .fila:hover { background: color-mix(in srgb, var(--sup), #fff 3.5%); }
  .fila:focus-visible { outline-offset: -2px; }
  .fila[aria-expanded="true"] { background: color-mix(in srgb, var(--sup), #fff 3.5%); }
  .c-hora { grid-area: hora; display: flex; flex-direction: column; align-self: start; padding-top: 1px; }
  .c-hora .hh { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-16); font-weight: 700; color: var(--tinta-2);
                font-variant-numeric: tabular-nums; }
  .c-hora .dd { font-size: var(--t-12); color: var(--tinta-3); white-space: nowrap; }
  .c-liga { grid-area: liga; align-self: start; display: flex; }
  .c-liga .insignia { height: 1.25rem; min-width: 2.125rem; font-size: 0.6875rem; }
  .c-local { grid-area: local; }
  .c-visita { grid-area: visita; }
  .c-1 { grid-area: p1; }
  .c-x { grid-area: px; }
  .c-2 { grid-area: p2; }
  .c-d, .c-xg, .c-g, .c-m, .c-rep { display: none; }

  .c-eq { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 8px; }
  .partido.pendiente .c-eq .nom { color: var(--tinta-3); }
  .c-eq .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               font-size: var(--t-16); font-weight: 500; color: var(--tinta-2); }
  .c-eq.gana .nom { color: var(--tinta); font-weight: 700; }

  .escudo { flex-shrink: 0; width: 24px; height: 24px; display: grid; place-items: center; }
  .escudo img { width: 24px; height: 24px; object-fit: contain; display: block; }
  .escudo.mono { border-radius: 50%; background: var(--linea-viva); color: var(--tinta-2);
                 font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-12); font-weight: 700; }

  /* celda de probabilidad: fondo del tramo de la escala, tinta elegida por luminancia */
  .c-p {
    display: grid; place-items: center; height: 2.625rem; border-radius: var(--r-celda);
    background: var(--bg); color: var(--fg);
    font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-18); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .c-p.gana { font-weight: 800; }
  .c-p.nada { background: var(--panel-alto); color: var(--tinta-3); font-weight: 500; }

  /* ---- tabla: el panel central ya tiene ancho para una línea por partido.
     Las columnas entran por prioridad: 1X2, luego más de 2.5 y ambos marcan,
     luego la doble oportunidad, luego goles esperados y muestra, y al final
     la barra de reparto ---- */
  @container centro (min-width: 640px) {
    .cab-tabla, .fila {
      grid-template-areas: none;
      grid-template-columns: var(--col-hora) var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.375rem 3.375rem 3.375rem;
      gap: 0 6px; align-items: center;
    }
    .cab-tabla {
      display: grid; padding: 0 16px; background: var(--sup); border-bottom: 1px solid var(--linea);
      font-size: var(--t-13); font-weight: 600; color: var(--tinta-3);
    }
    .cab-tabla span { padding: 8px 0; font: inherit; color: inherit; }
    .cab-tabla .der { text-align: center; }
    .cab-tabla [data-tip] { cursor: help; }
    .fila { padding: 0 16px; min-height: 3.875rem; }
    .fila > *, .cab-tabla > * { grid-area: auto; }
    .c-hora, .c-liga { align-self: center; padding-top: 0; }
    .c-hora { flex-direction: row; align-items: baseline; gap: 6px; }
    .con-dia .c-hora { flex-direction: column; align-items: flex-start; gap: 0; }
    .c-eq { padding-right: 12px; }
  }
  @container centro (min-width: 780px) {
    .cab-tabla, .fila {
      grid-template-columns: var(--col-hora) var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.375rem 3.375rem 3.375rem
                             3.25rem 3.25rem;
    }
    .c-g { display: grid; place-items: center; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-16);
           font-weight: 600; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  }
  @container centro (min-width: 940px) {
    .cab-tabla, .fila {
      grid-template-columns: var(--col-hora) var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.375rem 3.375rem 3.375rem
                             3rem 3rem 3rem 3.25rem 3.25rem;
    }
    .c-d { display: grid; place-items: center; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-16);
           font-weight: 600; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  }
  @container centro (min-width: 1080px) {
    .cab-tabla, .fila {
      grid-template-columns: var(--col-hora) var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.375rem 3.375rem 3.375rem
                             3rem 3rem 3rem 5.75rem 3.25rem 3.25rem 4.25rem;
    }
    .c-xg, .c-m { display: grid; place-items: center; font-size: var(--t-14); color: var(--tinta-3); font-variant-numeric: tabular-nums; }
    .c-m.poca { display: flex; justify-content: center; align-items: center; gap: 5px; color: var(--tinta); }
  }
  @container centro (min-width: 1280px) {
    .cab-tabla, .fila {
      grid-template-columns: var(--col-hora) var(--col-liga) minmax(0, 1fr) minmax(0, 1fr) 3.375rem 3.375rem 3.375rem
                             3rem 3rem 3rem 5.75rem 3.25rem 3.25rem 4.25rem 10rem;
    }
    .c-rep { display: flex; align-items: center; gap: 2px; height: 10px; padding-left: 14px; }
    .c-rep i { display: block; height: 10px; min-width: 2px; }
    .c-rep i:first-child { border-radius: 5px 0 0 5px; }
    .c-rep i:last-child { border-radius: 0 5px 5px 0; }
    .cab-tabla .c-rep { display: block; height: auto; padding-left: 14px; }
  }

  /* ---- detalle desplegado ---- */
  .detalle { margin: 0 12px 14px; padding: 16px 18px 18px; background: var(--panel-hondo);
             border: 1px solid var(--linea); border-radius: var(--r-tarjeta); }
  .accion {
    display: inline-flex; align-items: center; gap: 8px; min-height: 2.5rem; padding: 0 14px;
    border: 1px solid var(--linea-viva); border-radius: 999px; background: var(--panel-alto); color: var(--tinta);
    font: inherit; font-size: var(--t-14); font-weight: 600; cursor: pointer;
  }
  .accion:hover { border-color: var(--tinta-2); }
  .accion[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--oscura); }
  .accion.principal { background: var(--tinta); border-color: var(--tinta); color: var(--oscura); }
  .accion[disabled] { opacity: 0.55; cursor: progress; }
  /* los avisos de Mis equipos: la tarjeta de arriba de la vista y la invitación del detalle */
  .avisos-tarjeta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; margin: 12px; padding: 16px 18px;
                    background: var(--panel-alto); border: 1px solid var(--linea); border-radius: var(--r-tarjeta); }
  .avisos-tarjeta > svg, .det-avisos > svg { flex-shrink: 0; margin-top: 2px; color: var(--tinta-2); }
  .avisos-tarjeta h2 { margin: 0 0 4px; font-family: var(--f-disp); font-size: var(--t-18); font-weight: 700; }
  .avisos-tarjeta p { margin: 0; max-width: 62ch; color: var(--tinta-2); font-size: var(--t-14); line-height: 1.5; }
  .avisos-tarjeta .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .avisos-tarjeta .error, .det-avisos .error { margin-top: 8px; color: var(--critico); font-weight: 600; }
  .vacio ~ .avisos-tarjeta { margin: 0 20px 20px; max-width: 600px; }
  .avisos-tarjeta a.accion { text-decoration: none; }
  .det-avisos { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 14px 0 0; padding: 12px 14px;
                background: var(--panel-alto); border: 1px solid var(--linea); border-radius: var(--r-tarjeta); }
  .det-avisos p { flex: 1 1 14rem; margin: 0; color: var(--tinta-2); font-size: var(--t-14); }
  .det-avisos .error { flex-basis: 100%; }
  /* la página de cada equipo (#/equipo/86): su ficha arriba, sus próximos partidos y lo
     que dijo la web. Los nombres de equipo enlazan con ella desde el detalle y la tabla. */
  .det-eq a.n, .tabla-liga a.nom { color: inherit; text-decoration: underline; text-decoration-color: var(--linea-viva);
                                  text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .det-eq a.n:hover, .tabla-liga a.nom:hover { text-decoration-color: var(--tinta-2); }
  .detalle.eq-ficha { margin-top: 12px; }
  .eq-cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px 16px;
            padding: 4px 0 16px; border-bottom: 1px solid var(--linea); }
  .eq-cab > .escudo, .eq-cab > .escudo img { width: 64px; height: 64px; }
  .eq-cab > .escudo.mono { font-size: var(--t-24); }
  .eq-que { display: grid; gap: 4px; min-width: 0; }
  .eq-que p { margin: 0; }
  .eq-liga { display: flex; align-items: center; gap: 8px; font-size: var(--t-13); font-weight: 600; color: var(--tinta-2); }
  .eq-liga .insignia { flex-shrink: 0; }
  .eq-puesto { font-family: var(--f-disp); font-size: var(--t-20); font-weight: 600; color: var(--tinta-2); line-height: 1.2; }
  .eq-puesto b { font-weight: 800; color: var(--tinta); }
  .eq-balance { font-size: var(--t-13); line-height: 1.4; color: var(--tinta-3); }
  .eq-acciones { grid-column: 3; grid-row: 1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .eq-acciones .accion { min-height: 2.25rem; padding: 0 12px; font-size: var(--t-13); }
  .eq-forma-fila { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .eq-forma-fila .k { font-size: var(--t-12); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-3); }
  @container centro (max-width: 559px) {
    .eq-cab { grid-template-columns: auto minmax(0, 1fr); }
    .eq-acciones { grid-column: 1 / -1; grid-row: auto; justify-content: flex-start; }
    .eq-cab > .escudo, .eq-cab > .escudo img { width: 52px; height: 52px; }
  }
  .eq-forma { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .eq-forma li { display: grid; justify-items: center; min-width: 3rem; padding: 5px 6px 6px; border-radius: var(--r-celda);
                 font-variant-numeric: tabular-nums; }
  .eq-forma b { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-16); font-weight: 800; line-height: 1.1; }
  .eq-forma span { font-size: var(--t-12); font-weight: 600; }
  .eq-forma .g { background: var(--tinta); color: var(--oscura); }
  .eq-forma .e { background: var(--panel-alto); color: var(--tinta); box-shadow: inset 0 0 0 1px var(--linea-viva); }
  .eq-forma .p { background: none; color: var(--tinta-2); box-shadow: inset 0 0 0 1px var(--linea-viva); }
  .eq-ficha .cas .corto { display: none; }
  @container centro (max-width: 399px) {   /* "Descenso <1" no cabe en un tercio del panel */
    .eq-ficha .cas .largo { display: none; }
    .eq-ficha .cas .corto { display: inline; }
  }
  .eq-proy { margin: 10px 0 0; font-size: var(--t-14); color: var(--tinta-2); }
  .eq-proy b { color: var(--tinta); }
  .eq-ir { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: var(--t-14); font-weight: 600;
           color: var(--tinta); text-decoration: none; }
  .eq-ir:hover { text-decoration: underline; text-underline-offset: 3px; }
  .eq-fuerza { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .eq-fz { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; padding: 10px 12px 12px;
           border-radius: var(--r-control); background: var(--panel-alto); min-width: 0; }
  .eq-fz .k { font-size: var(--t-12); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-3); }
  .eq-fz .puesto { font-size: var(--t-13); font-weight: 600; color: var(--tinta-2); white-space: nowrap; }
  .eq-fz b { grid-column: 1 / -1; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800; line-height: 1;
             font-variant-numeric: tabular-nums; }
  .eq-fz p { grid-column: 1 / -1; margin: 4px 0 0; font-size: var(--t-13); line-height: 1.4; color: var(--tinta-2); text-wrap: pretty; }
  .eq-ficha .nota, .eq-web .nota, .eq-sin .nota { margin: 10px 0 0; font-size: var(--t-13); line-height: 1.5; color: var(--tinta-3);
                                                  max-width: 75ch; }
  .eq-sin { padding: 4px 20px 16px; }
  .eq-web .det-bloque { padding-top: 4px; }
  /* el detalle: cabecera con los dos equipos, luego bloques con título pequeño.
     Oro = probabilidad (cada tramo con su tono de la rampa); lo que no es una
     probabilidad (goles esperados) va en la tinta del texto. */
  .det-cab { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 12px;
             padding: 4px 0 18px; border-bottom: 1px solid var(--linea); }
  .det-cab .accion { margin-top: 6px; min-height: 2.25rem; padding: 0 12px; font-size: var(--t-13); }
  .det-eq .accion { margin-top: auto; }   /* las dos estrellas a la misma altura aunque un nombre ocupe dos líneas */
  /* con el panel estrecho (móvil), "Seguir" se queda en la estrella: con el texto no cabía
     en la columna de cada equipo y el borde del detalle lo cortaba */
  @container centro (max-width: 419px) {
    .det-eq .accion { width: 2.25rem; padding: 0; justify-content: center; }
    .det-eq .accion span { display: none; }
  }
  .det-eq .n { margin-bottom: 6px; }
  .det-eq { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; text-align: center; }
  .det-eq .escudo, .det-eq .escudo img { width: 44px; height: 44px; }
  .det-eq .escudo.mono { font-size: var(--t-18); }
  .det-eq .n { font-size: var(--t-16); font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; text-wrap: balance; }
  .det-eq .rol { order: -1; font-size: var(--t-12); color: var(--tinta-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .det-cuando { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; }
  .det-cuando .hora { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800; line-height: 1;
                      font-variant-numeric: tabular-nums; }
  .det-cuando .dia { font-size: var(--t-13); color: var(--tinta-3); white-space: nowrap; }
  .det-rejilla { display: grid; gap: 0 32px; }
  @container centro (min-width: 760px) { .det-rejilla:not(.una) { grid-template-columns: 1fr 1fr; } }
  .det-col { display: grid; align-content: start; min-width: 0; }
  .det-veredicto { margin: 14px 0 0; font-size: var(--t-15); line-height: 1.45; color: var(--tinta-2); text-wrap: pretty; }
  .det-veredicto b { color: var(--tinta); font-weight: 700; }
  .cuota { font-size: var(--t-12); color: var(--tinta-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .det-bloque { padding: 18px 0 0; min-width: 0; }
  .det-bloque h2, .det-datos h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: var(--t-12); font-weight: 700;
                                  letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-3); }
  .det-bloque h2 small { font-size: var(--t-13); font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--tinta-2); }

  .reparto { display: flex; gap: 2px; height: 1.75rem; border-radius: var(--r-celda); overflow: hidden; }
  .reparto.grande { height: 2.75rem; }
  .reparto i { display: grid; place-items: center; min-width: 4px; background: var(--bg); color: var(--fg); font-style: normal; }
  .reparto b { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-14); font-weight: 800; font-variant-numeric: tabular-nums; }
  .reparto.grande b { font-size: var(--t-20); }
  .rep-ley { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .rep-ley.dos { grid-template-columns: 1fr 1fr; }
  .rep-ley > span { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .rep-ley > span:nth-child(2) { align-items: center; text-align: center; }
  .rep-ley > span:last-child { align-items: flex-end; text-align: right; }
  .rep-ley .nom { display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; }
  .rep-ley i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--bg); }
  .rep-ley .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-13); color: var(--tinta-2); }
  .rep-ley b { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-18); font-weight: 700; font-variant-numeric: tabular-nums; }
  .rep-ley .fav .k { color: var(--tinta); font-weight: 700; }
  .rep-ley .fav b { font-weight: 800; }
  .rep-ley.dos > span { flex-direction: row; align-items: baseline; gap: 8px; }
  .rep-ley.dos > span:last-child { justify-content: flex-end; }
  .rep-ley.dos b { font-size: var(--t-15); }

  .casillas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .casillas.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .casillas.dos .cas { grid-template-columns: minmax(0, 1fr) auto; }
  .casillas.dos .cas small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cas { display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 8px; padding: 9px 12px 10px;
         border-radius: var(--r-control); background: var(--bg); color: var(--fg); min-width: 0; }
  .cas small { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-14); font-weight: 700; opacity: 0.8; }
  .cas b { justify-self: end; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-24); font-weight: 800; line-height: 1;
           font-variant-numeric: tabular-nums; }
  .cas > span:last-child { grid-column: 1 / -1; margin-top: 2px; }
  .cas .cuota { font-family: var(--f-txt); font-size: var(--t-12); font-weight: 500; color: inherit; opacity: 0.8; }
  .cas .que { grid-column: 1 / -1; margin-top: 4px; font-size: var(--t-12); line-height: 1.25; opacity: 0.85; text-wrap: balance; }

  .xg { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) auto; align-items: center; gap: 0 10px; }
  .xg > b { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-24); font-weight: 800; }
  .xg-b { display: flex; height: 12px; background: var(--linea); }
  .xg-b.izq { justify-content: flex-end; border-radius: 6px 0 0 6px; }
  .xg-b.der { border-radius: 0 6px 6px 0; }
  .xg-b i { display: block; height: 100%; background: var(--tinta-2); }
  .xg-b.izq i { border-radius: 6px 0 0 6px; }
  .xg-b.der i { border-radius: 0 6px 6px 0; }
  .xg-ley { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: var(--t-13); color: var(--tinta-3); }
  .xg-ley span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cero { display: grid; grid-template-columns: minmax(0, 12rem) minmax(0, 1fr) 4rem; align-items: center; gap: 10px; padding: 3px 0; }
  .cero-v { display: flex; flex-direction: column; align-items: flex-end; }
  .cero .k { font-size: var(--t-14); color: var(--tinta-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cero .mini { height: 10px; border-radius: 5px; background: var(--linea); overflow: hidden; }
  .cero .mini i { display: block; height: 100%; border-radius: 5px; background: var(--bg); }
  .cero b, .lin .k { font-family: var(--f-disp); font-stretch: 88%; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cero b { text-align: right; font-size: var(--t-16); }

  .lineas { display: grid; gap: 6px; }
  .lin, .lin-cab { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); align-items: center; gap: 10px; }
  .lin-cab { grid-template-columns: 2.25rem 1fr 1fr; font-size: var(--t-12); color: var(--tinta-3); }
  .lin-cab span:last-child { text-align: right; }
  .lin .k { font-size: var(--t-15); color: var(--tinta-2); align-self: start; line-height: 28px; }
  .lin-cuotas { display: flex; justify-content: space-between; margin-top: 3px; }

  .marcs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .marc { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px;
          border: 1px solid var(--linea); border-radius: var(--r-control); background: var(--panel); }
  .marc.primero { border-color: var(--tinta-2); }
  .marc .cuota { font-size: var(--t-12); color: var(--tinta-3); }
  .marc b { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-24); font-weight: 800; line-height: 1;
            font-variant-numeric: tabular-nums; }
  .marc small { font-size: var(--t-13); color: var(--tinta-2); font-variant-numeric: tabular-nums; }

  .det-datos { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--linea); }
  .det-datos dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 28px; margin: 0; }
  .det-datos dt { font-size: var(--t-12); font-weight: 600; color: var(--tinta-3); }
  .det-datos dd { margin: 2px 0 0; font-size: var(--t-14); color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  .aviso { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; font-size: var(--t-14); color: var(--tinta-2); }
  .aviso svg { flex-shrink: 0; margin-top: 3px; }
  /* goles totales del partido: una barra por resultado, la más probable en oro pleno */
  .goles-graf { display: flex; align-items: flex-end; gap: 4px; }
  .goles-graf .gb { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1 1 0; max-width: 3.5rem; }
  .goles-graf .gb i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--oro-medio); }
  .goles-graf .gb.max i { background: var(--oro); }
  .goles-graf .v { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-13); font-weight: 600; color: var(--tinta-2);
                   font-variant-numeric: tabular-nums; }
  .goles-graf .gb.max .v { color: var(--tinta); font-weight: 800; }
  .goles-graf .k { width: 100%; padding-top: 3px; border-top: 1px solid var(--linea-viva);
                   text-align: center; font-size: var(--t-12); color: var(--tinta-3); }
  .detalle .nw { white-space: nowrap; }
  .detalle .nota-goles { margin: 14px 0 0; max-width: 72ch; font-size: var(--t-13); color: var(--tinta-3); }

  .vacio { padding: 40px 20px; max-width: 600px; }
  .vacio h2 { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800; margin: 0 0 10px; letter-spacing: -0.015em; }
  .vacio p { margin: 0 0 8px; color: var(--tinta-2); font-size: var(--t-16); max-width: 62ch; }
  .vacio .pasos { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .vacio .pasos li { display: flex; gap: 14px; padding: 12px 14px; border-radius: var(--r-tarjeta); background: var(--panel-alto);
                     font-size: var(--t-14); color: var(--tinta-2); }
  .vacio .pasos b { color: var(--tinta); font-weight: 700; min-width: 96px; }

  /* ---------------- tableros laterales ---------------- */
  .modulo { padding: 20px 18px 22px; border-bottom: 1px solid var(--linea); }
  .modulo h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 14px;
               font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-20); font-weight: 800; letter-spacing: -0.01em; }
  .modulo h2 .meta { margin-left: auto; font-family: var(--f-txt); font-size: var(--t-13); font-weight: 500; color: var(--tinta-3);
                     letter-spacing: 0; white-space: nowrap; }
  .modulo .nota { margin: 14px 0 0; font-size: var(--t-13); color: var(--tinta-3); }
  .placeholder { margin: 0; font-size: var(--t-14); color: var(--tinta-3); }
  @media (min-width: 1180px) { .pane-izq .modulo:last-child, .pane-der .modulo:last-child { border-bottom: 0; } }

  .ligas { display: grid; gap: 4px; }
  .liga-fila {
    display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) auto; grid-template-rows: auto auto;
    align-items: center; gap: 0 12px; width: 100%; text-align: left; cursor: pointer;
    padding: 9px 10px; border: 1px solid transparent; border-radius: var(--r-tarjeta); background: none;
  }
  .liga-fila:hover { background: var(--panel-alto); }
  .liga-fila[aria-current="true"] { background: var(--panel-alto); border-color: var(--tinta-2); }
  .liga-fila .insignia { grid-row: 1 / 3; }
  .liga-fila .nom { grid-column: 2; grid-row: 1; align-self: end; font-size: var(--t-16); font-weight: 700;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liga-fila .stats { grid-column: 2 / -1; grid-row: 2; align-self: start; font-size: var(--t-13); color: var(--tinta-3);
                      font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liga-fila .n { grid-column: 3; grid-row: 1; align-self: end; min-width: 2.25rem; padding: 2px 8px; border-radius: 999px; text-align: center;
                  background: var(--panel-hondo); font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-15); font-weight: 700;
                  color: var(--tinta-2); }
  .liga-fila[aria-current="true"] .n { background: var(--tinta); color: var(--oscura); }
  .liga-fila.sin-stats .nom, .liga-fila.sin-stats .n { grid-row: 1 / 3; align-self: center; }

  /* los más claros: el favorito de cada partido con su casilla, de más a menos claro */
  .claros { display: grid; gap: 6px; }
  .claro {
    display: grid; grid-template-columns: 3.375rem minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
    width: 100%; text-align: left; cursor: pointer;
    padding: 7px 10px 7px 7px; border: 1px solid var(--linea); border-radius: var(--r-tarjeta); background: var(--panel-hondo);
  }
  .claro:hover { border-color: var(--linea-viva); background: var(--panel-alto); }
  /* resultados: lo mismo, ya jugado; no se abre (el partido salió de la ventana) */
  .res { display: grid; grid-template-columns: 3.375rem minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
         padding: 7px 10px 7px 7px; border: 1px solid var(--linea); border-radius: var(--r-tarjeta); background: var(--panel-hondo); }
  .claro .casilla, .res .casilla { display: grid; place-items: center; height: 2.75rem; border-radius: var(--r-control);
                    background: var(--bg); color: var(--fg);
                    font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-20); font-weight: 800; font-variant-numeric: tabular-nums; }
  .claro .txt, .res .txt { display: flex; flex-direction: column; min-width: 0; }
  .claro .quien, .res .quien { font-size: var(--t-15); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .claro .contra, .res .contra { font-size: var(--t-13); color: var(--tinta-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .claro .cuando, .res .cuando { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: var(--t-13); color: var(--tinta-2);
                   white-space: nowrap; }
  .claro .cuando .insignia, .res .cuando .insignia { height: 1.25rem; min-width: 2rem; font-size: 0.6875rem; }
  .res .marcador { display: flex; gap: 6px; }
  .res .marcador .eq { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .res .marcador b { flex: none; font-family: var(--f-disp); font-stretch: 88%; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* últimos 7 días: en cuántos acertó el favorito (blanco: lo que pasó) frente a lo
     que esperaban sus probabilidades (marca oro: es una probabilidad) */
  .sem-cifra { display: flex; align-items: center; gap: 14px; margin: 0 0 16px; font-size: var(--t-14); color: var(--tinta-2); }
  .sem-cifra .num { flex: none; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-28); font-weight: 800;
                    color: var(--tinta); line-height: 1; }
  .sem-tramos { display: grid; gap: 10px; }
  .sem-fila { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) 4rem; align-items: center; gap: 12px; }
  .sem-nom { display: flex; flex-direction: column; font-size: var(--t-14); font-weight: 600; line-height: 1.25; }
  .sem-nom small, .sem-val small { font-size: var(--t-12); font-weight: 500; color: var(--tinta-3); }
  .sem-barra { position: relative; height: 10px; border-radius: 5px; background: var(--linea-viva); }
  .sem-barra i { display: block; height: 100%; border-radius: 5px; background: var(--tinta-2); }
  .sem-barra b { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 2px;
                 background: var(--oro); }
  .sem-val { text-align: right; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-18); font-weight: 800;
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sem-leyenda { display: flex; gap: 16px; margin: 10px 0 0; font-size: var(--t-12); color: var(--tinta-3); }
  .sem-leyenda i { display: inline-block; vertical-align: -1px; margin-right: 6px; border-radius: 2px; }
  .sem-leyenda .real { width: 14px; height: 8px; background: var(--tinta-2); }
  .sem-leyenda .esp { width: 3px; height: 12px; background: var(--oro); vertical-align: -3px; }
  .sem-sorpresa { display: grid; grid-template-columns: 3.375rem minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
                  margin-top: 16px; padding: 7px 10px 7px 7px; border: 1px solid var(--linea); border-radius: var(--r-tarjeta);
                  background: var(--panel-hondo); }
  .sem-sorpresa .casilla { display: grid; place-items: center; height: 2.75rem; border-radius: var(--r-control);
                           background: var(--bg); color: var(--fg); font-family: var(--f-disp); font-stretch: 88%;
                           font-size: var(--t-20); font-weight: 800; font-variant-numeric: tabular-nums; }
  .sem-sorpresa .txt { display: flex; flex-direction: column; min-width: 0; }
  .sem-sorpresa .eti { font-size: var(--t-12); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tinta-3); }
  .sem-sorpresa .marcador { display: flex; gap: 6px; font-size: var(--t-15); font-weight: 700; white-space: nowrap; }
  .sem-sorpresa .marcador .eq { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sem-sorpresa .marcador b { flex: none; font-family: var(--f-disp); font-stretch: 88%; font-weight: 800; }
  .sem-sorpresa .contra { font-size: var(--t-13); color: var(--tinta-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sem-sorpresa .cuando { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: var(--t-13);
                          color: var(--tinta-2); white-space: nowrap; }
  .sem-sorpresa .cuando .insignia { height: 1.25rem; min-width: 2rem; font-size: 0.6875rem; }

  .fiab { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) 3rem 2.75rem; align-items: center; gap: 0 10px;
          padding: 7px 0; font-size: var(--t-14); }
  .fiab .insignia { height: 1.375rem; min-width: 2.25rem; }
  .fiab .eje { position: relative; height: 12px; }
  .fiab .eje::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--linea-viva); }
  .fiab .eje i { position: absolute; top: 1px; height: 10px; border-radius: 3px; background: var(--tinta-2); }
  .fiab .eje i.neg { background: var(--tinta-3); }
  .fiab .val { text-align: right; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-16); font-weight: 700;
               font-variant-numeric: tabular-nums; }
  .fiab .acierto { text-align: right; color: var(--tinta-3); font-variant-numeric: tabular-nums; }
  .fiab-cab { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr) 3rem 2.75rem; gap: 0 10px;
              font-size: var(--t-13); color: var(--tinta-3); padding-bottom: 6px; border-bottom: 1px solid var(--linea); }
  .fiab-cab span:nth-child(3), .fiab-cab span:nth-child(4) { text-align: right; }
  .m-fiab .segmentos { margin: 0 0 12px; width: max-content; max-width: 100%; }
  .m-fiab .segmentos + .segmentos { margin-top: -4px; }

  /* histograma: el eje es probabilidad, así que cada barra lleva el oro de su tramo */
  .histo { display: flex; align-items: flex-end; gap: 3px; height: 120px; border-bottom: 1px solid var(--linea-viva); }
  .histo button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
                  height: 100%; border: 0; background: none; padding: 0; cursor: default; }
  .histo button i { display: block; width: min(100%, 26px); border-radius: 4px 4px 0 0; min-height: 0; background: var(--bg); }
  .histo button .etq { font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-14); font-weight: 800; color: var(--tinta);
                       margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .histo button:hover i, .histo button:focus-visible i { box-shadow: 0 0 0 2px var(--tinta); }
  .histo-eje { display: flex; gap: 3px; margin-top: 5px; }
  .histo-eje span { flex: 1; font-size: var(--t-12); color: var(--tinta-3); text-align: center; font-variant-numeric: tabular-nums; }

  /* tooltip único, posicionado al vuelo */
  .tip {
    position: fixed; z-index: 30; pointer-events: none; max-width: 280px;
    background: var(--tinta); color: var(--oscura); border-radius: var(--r-control); padding: 9px 11px;
    font-size: var(--t-13); line-height: 1.4; white-space: pre-line; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  /* aviso que se va solo (enlace copiado...) */
  .aviso-flotante {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40;
    transform: translateX(-50%); width: max-content; max-width: min(92vw, 26rem);
    padding: 12px 16px; border-radius: var(--r-tarjeta); background: var(--tinta); color: var(--oscura);
    font-size: var(--t-14); font-weight: 600; overflow-wrap: anywhere; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  @media (max-width: 879px) { .aviso-flotante { bottom: calc(88px + env(safe-area-inset-bottom)); } }

  /* la ventana de la cuenta: blanco para lo que se pulsa, rojo solo para borrar */
  .dialogo {
    width: min(29rem, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; overflow-y: auto;
    border: 1px solid var(--linea-viva); border-radius: var(--r-tablero); background: var(--panel); color: var(--tinta);
  }
  .dialogo::backdrop { background: rgba(0, 0, 0, 0.62); }
  .dialogo .cerrar {
    position: absolute; top: 12px; right: 12px; display: grid; place-items: center; width: 2.25rem; height: 2.25rem;
    border: 0; border-radius: 999px; background: none; color: var(--tinta-2); cursor: pointer;
  }
  .dialogo .cerrar:hover { background: var(--panel-alto); color: var(--tinta); }
  .dialogo .dentro { display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 20px; }
  .dialogo h2 { margin: 0 2.5rem 0 0; font-family: var(--f-disp); font-stretch: 88%; font-size: var(--t-24); font-weight: 800;
                letter-spacing: -0.01em; text-wrap: balance; }
  .dialogo p { margin: 0; font-size: var(--t-15); line-height: 1.5; color: var(--tinta-2); }
  .dialogo p strong { color: var(--tinta); font-weight: 600; }
  .dialogo .nota { font-size: var(--t-13); color: var(--tinta-3); }
  .dialogo .error { color: var(--critico); font-weight: 600; }
  .dialogo .acciones { display: flex; flex-direction: column; gap: 8px; }
  .dialogo .accion { justify-content: center; min-height: 2.75rem; text-decoration: none; }
  .dialogo .accion.borrar { color: var(--critico); }
  .dialogo .accion.borrar.principal { background: var(--critico); border-color: var(--critico); color: #ffffff; }
  .dialogo .bloque { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--linea); }
  .dialogo .bloque h3 { margin: 0; font-size: var(--t-13); font-weight: 700; color: var(--tinta-3);
                        text-transform: uppercase; letter-spacing: 0.06em; }
  .dialogo form { display: flex; flex-direction: column; gap: 12px; }
  .dialogo .campo { display: flex; flex-direction: column; gap: 6px; }
  .dialogo .campo span { font-size: var(--t-13); font-weight: 600; color: var(--tinta-2); }
  .dialogo .campo small { font-size: var(--t-13); color: var(--tinta-3); }
  .dialogo .turnstile { min-height: 65px; }
  .dialogo .ficha-cuenta .apagado { color: var(--tinta-3); font-weight: 400; }
  .dialogo input {
    width: 100%; min-width: 0; height: 2.75rem; padding: 0 12px; border: 1px solid var(--linea-viva);
    border-radius: var(--r-control); background: var(--fondo); color: var(--tinta); font: inherit; font-size: var(--t-16);
  }
  .dialogo input:focus { outline: 2px solid var(--tinta-2); outline-offset: 1px; }
  .dialogo .mensaje { color: var(--tinta); font-weight: 600; }
  .dialogo .ficha-cuenta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0;
                           font-size: var(--t-15); }
  .dialogo .ficha-cuenta dt { color: var(--tinta-3); }
  .dialogo .ficha-cuenta dd { margin: 0; color: var(--tinta); font-weight: 600; overflow-wrap: anywhere; }
  .dialogo .ficha-cuenta .id { font-family: var(--f-disp); letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
                               user-select: all; }
  .dialogo a.accion[aria-disabled] { pointer-events: none; opacity: 0.55; }
  .dialogo .equipos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .dialogo .equipos li { padding: 3px 10px; border-radius: 999px; background: var(--panel-alto); font-size: var(--t-13); }

  /* ---------------- barra de estado ---------------- */
  .estado-barra {
    align-items: stretch; height: 2.5rem;
    font-size: var(--t-13); color: var(--tinta-3); overflow: hidden; white-space: nowrap;
  }
  .estado-barra > span { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-right: 1px solid var(--linea); }
  .estado-barra > span:first-child { padding-left: 4px; }
  .estado-barra .der { margin-left: auto; border-right: 0; border-left: 1px solid var(--linea); }
  .estado-barra b { color: var(--tinta-2); font-weight: 700; font-variant-numeric: tabular-nums; }
  .estado-barra .medidor { width: 100px; height: 5px; background: var(--linea-viva); border-radius: 3px; overflow: hidden; }
  .estado-barra .medidor i { display: block; height: 100%; background: var(--tinta-2); }
  .estado-barra .err { color: var(--tinta); }
  .estado-barra .err svg { color: var(--critico); }

  /* ---------------- pestañas (móvil) ---------------- */
  .pestanas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--banda) 94%, transparent); border-top: 1px solid var(--linea);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .pestanas button {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 0; border-radius: var(--r-tarjeta); background: none; cursor: pointer; padding: 8px 0 7px;
    font-size: var(--t-13); font-weight: 600; color: var(--tinta-3);
  }
  .pestanas button[aria-current="true"] { color: var(--tinta); background: var(--panel-alto); }
  @media (max-width: 879px) {
    body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
    .app[data-pestana="partidos"] .lateral { display: none; }
    .app[data-pestana="panorama"] .centro,
    .app[data-pestana="ligas"] .centro { display: none; }
    .app[data-pestana="panorama"] .lateral,
    .app[data-pestana="ligas"] .lateral { display: block; grid-area: centro; }
    .app[data-pestana="panorama"] .pane-izq { display: none; }
    .app[data-pestana="ligas"] .pane-der { display: none; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .fila, .dia-celda, .prox, .liga-fila, .segmentos button, .claro, .tira-ligas button, .pestanas button {
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
  }
  @media (prefers-reduced-motion: reduce) { .punto { animation: none !important; } }
</style>
</head>
<body>
<a class="salto" href="#vista">Saltar a los partidos</a>

<div class="app" data-pestana="partidos">
  <header class="cab" id="cab">
    <a class="marca" href="#/" aria-label="Pronósticos, inicio">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="8.5" width="7.6" height="15" rx="2" fill="#ffd24c"></rect>
        <rect x="12.2" y="8.5" width="7.6" height="15" rx="2" fill="#a18047"></rect>
        <rect x="21.4" y="8.5" width="7.6" height="15" rx="2" fill="#594d39"></rect>
      </svg>
      <span class="nombre">Pronósticos</span>
    </a>
    <button class="instalar" id="instalar" aria-label="Instalar app" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M4.8 7 8 10.2 11.2 7"></path><path d="M3 12.5h10"></path></svg>
      <span class="corto" aria-hidden="true">App</span><span class="largo" aria-hidden="true">Instalar app</span></button>
    <div class="estado-corto" id="estado-corto" data-modo="reposo"><span class="punto"></span><span class="txt">Cargando</span></div>
    <button class="boton-cuenta" id="boton-cuenta" type="button" aria-haspopup="dialog" aria-label="Entrar: guarda tus equipos" hidden>
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="5.4" r="2.7"></circle><path d="M2.8 14c.6-2.8 2.7-4.3 5.2-4.3s4.6 1.5 5.2 4.3"></path></svg>
      <span class="txt">Entrar</span></button>
    <label class="buscar">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <input id="buscador" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar equipo" aria-label="Buscar equipo">
      <kbd>/</kbd>
    </label>
    <div class="proximos" id="proximos" aria-label="Próximos partidos"></div>
  </header>

  <main class="centro" aria-label="Partidos">
    <div class="carril" id="fechas" role="toolbar" aria-label="Días"></div>
    <div class="banda" id="banda" hidden></div>
    <div class="tira-ligas" id="tira-ligas" role="toolbar" aria-label="Ligas"></div>
    <div class="herramientas">
      <h1 class="titulo-vista" id="titulo-vista">Pronósticos</h1>
      <div id="limpiar-hueco"></div>
      <div class="segmentos" id="orden" role="group" aria-label="Ordenar: por hora, más claros primero o más reñidos primero"></div>
    </div>
    <div class="cab-tabla" aria-hidden="true">
      <span>Hora</span><span class="c-liga">Liga</span><span>Local</span><span>Visitante</span>
      <span class="der" data-tip="Gana el local">1</span><span class="der" data-tip="Empate">X</span><span class="der" data-tip="Gana el visitante">2</span>
      <span class="der c-d" data-tip="Doble oportunidad: gana el local o empate">1X</span><span class="der c-d" data-tip="Doble oportunidad: empate o gana el visitante">X2</span><span class="der c-d" data-tip="Doble oportunidad: gana cualquiera de los dos, sin empate">12</span>
      <span class="der c-xg" data-tip="Goles que el modelo espera de cada equipo">Goles esp.</span><span class="der c-g" data-tip="Más de 2.5 goles: 3 o más en el partido">+2.5</span><span class="der c-g" data-tip="Marcan los dos equipos">Ambos</span><span class="der c-m" data-tip="Partidos de liga (esta temporada y la anterior) del equipo con menos. Con menos de 4, el número tira hacia un equipo medio">Muestra</span><span class="c-rep" data-tip="El 1 X 2 en una barra">Reparto</span>
    </div>
    <div class="vista" id="vista" tabindex="-1"></div>
  </main>

  <div class="lateral">
    <aside class="pane-izq" id="pane-ligas" aria-label="Ligas y fiabilidad"></aside>
    <aside class="pane-der" id="pane-panorama" aria-label="Panorama de la ventana"></aside>
  </div>

  <footer class="estado-barra" id="estado-barra" data-modo="reposo"></footer>

  <nav class="pestanas" aria-label="Secciones">
    <button data-p="partidos" aria-current="true">
      <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      Partidos</button>
    <button data-p="panorama" aria-current="false">
      <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5" fill="currentColor"></rect><rect x="11" y="3" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="3" y="11" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="11" y="11" width="6" height="6" rx="1.5" fill="currentColor"></rect></svg>
      Panorama</button>
    <button data-p="ligas" aria-current="false">
      <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="4" height="4" rx="1.2" fill="currentColor"></rect><rect x="2.5" y="12.5" width="4" height="4" rx="1.2" fill="currentColor"></rect><path d="M9.5 5.5h8M9.5 14.5h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      Ligas</button>
  </nav>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="aviso-flotante" id="aviso-flotante" role="status" aria-live="polite" hidden></div>
<dialog class="dialogo" id="dialogo-cuenta" aria-labelledby="cuenta-titulo">
  <button class="cerrar" type="button" data-cuenta="cerrar" aria-label="Cerrar">
    <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg></button>
  <div class="dentro" id="cuenta-dentro"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
